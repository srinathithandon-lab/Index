<!DOCTYPE html> <html lang="th"> <head>   <meta charset="UTF-8" />   <meta name="viewport" content="width=device-width, initial-scale=1.0" />   <title>ทะเบียนถังแก๊ส — Cenergy Solutions</title>   <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>   <style>     * { box-sizing: border-box; font-family: "Segoe UI", sans-serif; margin: 0; padding: 0; }     body { background: #f0f4f8; padding: 16px; max-width: 1200px; margin: 0 auto; color: #333; }      /* ===== แถบสถานะ ซิงค์ข้อมูล ===== */     .sync-bar {       background: #e8f7ff;       padding: 14px 18px;       border-radius: 10px;       margin-bottom: 14px;       display: flex;       justify-content: space-between;       align-items: center;       flex-wrap: wrap;       gap: 12px;       border: 1px solid #b3e5fc;     }     .sync-status {       font-size: 14px;       color: #0277bd;       display: flex;       align-items: center;       gap: 8px;     }     .sync-status.err { color: #d32f2f; }     .sync-status.ok { color: #2e7d32; }     .sync-status.pending { color: #e65100; }     .sync-btn {       padding: 10px 22px;       background: #1976d2;       color: white;       border: none;       border-radius: 8px;       cursor: pointer;       font-size: 14px;       font-weight: 500;     }     .sync-btn:hover { background: #1565c0; }     .sync-btn.sync-upload { background: #2e7d32; }     .sync-btn.sync-upload:hover { background: #27692a; }     .btn-export {       background: #ed6c02;       color: white;       border: none;     }     .btn-export:hover { background: #e65100; }      /* ===== แถบแจ้งเตือน ===== */     .alert-box {       background: #fff3e0;       border: 1px solid #ffe0b2;       border-radius: 10px;       padding: 12px 16px;       margin-bottom: 18px;       font-size: 14px;       line-height: 1.6;       color: #e65100;     }      /* ===== ปุ่มด้านบน ===== */     .top-buttons {       display: flex;       gap: 12px;       margin-bottom: 18px;       flex-wrap: wrap;     }     .btn-main {       padding: 12px 20px;       border: none;       border-radius: 8px;       font-size: 15px;       cursor: pointer;       display: flex;       align-items: center;       gap: 8px;       font-weight: 500;     }     .btn-scan {       background: #7b1fa2;       color: white;     }     .btn-scan:hover { background: #6a1b9a; }     .btn-danger-all {       background: #c62828;       color: white;       border: none;     }     .btn-danger-all:hover { background: #b71c1c; }      /* ===== ช่องค้นหา ===== */     .search-row {       display: flex;       gap: 10px;       margin-bottom: 20px;       flex-wrap: wrap;     }     .search-input {       flex: 1;       min-width: 200px;       padding: 12px 16px;       border: 1px solid #ccc;       border-radius: 8px;       font-size: 15px;       background: #fff;     }     .search-btn {       padding: 12px 24px;       background: #1976d2;       color: white;       border: none;       border-radius: 8px;       font-size: 15px;       cursor: pointer;       font-weight: 500;     }     .search-btn:hover { background: #1565c0; }      /* ===== แถบปุ่มสลับรายงาน ===== */     .view-tabs {       display: flex;       gap: 10px;       margin-bottom: 20px;       flex-wrap: wrap;     }     .tab-btn {       padding: 12px 18px;       border: none;       border-radius: 8px;       font-size: 14px;       cursor: pointer;       background: #ffffff;       color: #555;       border: 1px solid #ddd;       display: flex;       align-items: center;       gap: 6px;       transition: all 0.2s;     }     .tab-btn.active {       background: #e3f2fd;       color: #1976d2;       border-color: #90caf9;       font-weight: 500;     }     .tab-btn:hover:not(.active) { background: #f5f5f5; border-color: #bbb; }     .tab-count {       background: #1976d2;       color: white;       font-size: 13px;       padding: 2px 10px;       border-radius: 12px;       margin-left: 6px;       min-width: 28px;       text-align: center;     }     .tab-btn.active .tab-count { background: #1565c0; }      /* ===== สรุปจำนวนถัง ===== */     .summary-bar {       background: #e8f5e9;       padding: 14px 18px;       border-radius: 10px;       margin-bottom: 14px;       border: 1px solid #c8e6c9;       font-size: 15px;     }      /* ===== ตารางแสดงรายการ ===== */     .table-container {       overflow-x: auto;       border-radius: 10px;       border: 1px solid #ccc;       background: white;       margin-top: 10px;     }     table {       width: 100%;       border-collapse: collapse;       font-size: 11px;       white-space: nowrap;     }     th {       background: #1976d2;       color: white;       padding: 7px 3px;       text-align: center;       border: 1px solid #1565c0;       font-weight: 500;       font-size: 10px;     }     td {       padding: 6px 3px;       text-align: center;       border: 1px solid #e0e0e0;     }     tr:hover td { background: #f5f9fc; }     .serial-cell {       font-weight: bold;       color: #1565c0;       background: #e3f2fd;       cursor: pointer;       text-decoration: underline;     }     .weight-cell {       font-weight: bold;       color: #e65100;     }     .total-kg {       font-weight: bold;       background: #e8f5e9;       color: #2e7d32;       font-size: 13px;     }     .row-pending { background: #fff8e1; }      /* ===== กล้องสแกน QR ===== */     .scan-box {       position: relative;       width: 100%;       max-width: 480px;       margin: 15px auto;       border-radius: 12px;       overflow: hidden;       border: 3px solid #7b1fa2;       background: #000;     }     video { width: 100%; height: auto; display: block; }     canvas { display: none; }     .scan-frame {       position: absolute;       inset: 0;       border: 4px solid #ffc107;       box-shadow: inset 0 0 0 9999px rgba(0,0,0,0.4);       pointer-events: none;     }     .scan-hint {       text-align: center;       padding: 10px;       color: #7b1fa2;       font-size: 14px;     }     .scan-close {       position: absolute;       top: 8px;       right: 8px;       background: rgba(0,0,0,0.6);       color: white;       border: none;       border-radius: 50%;       width: 36px;       height: 36px;       font-size: 18px;       cursor: pointer;       z-index: 10;     }      /* ===== ซ่อน/แสดง ===== */     .hidden { display: none !important; }      /* ===== ฟอร์มบันทึกข้อมูล ===== */     .form-card {       background: #fafafa;       padding: 22px;       border-radius: 10px;       margin-bottom: 18px;       border: 1px solid #e0e0e0;     }     .form-title {       font-size: 16px;       font-weight: 600;       margin: 14px 0 10px 0;       color: #1976d2;       border-bottom: 2px solid #1976d2;       padding-bottom: 6px;     }     .form-grid {       display: grid;       grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));       gap: 12px;     }     .form-group { display: flex; flex-direction: column; }     label { font-size: 13px; color: #555; margin-bottom: 5px; }     input {       padding: 10px 12px;       border: 1px solid #ccc;       border-radius: 6px;       font-size: 15px;       background: #fff;     }     input:focus { outline: none; border-color: #1976d2; box-shadow: 0 0 0 3px rgba(25,118,210,0.1); }     input[readonly] { background: #f5f5f5; color: #1565c0; font-weight: 500; }     .save-btn {       width: 100%;       background: #1976d2;       color: white;       border: none;       padding: 15px;       font-size: 17px;       border-radius: 10px;       cursor: pointer;       margin-top: 10px;       font-weight: 500;     }     .save-btn:hover { background: #1565c0; }     .save-btn.edit-mode { background: #2e7d32; }     .save-btn.edit-mode:hover { background: #27692a; }      /* ===== ตัวกรองวันที่ ===== */     .filter-bar {       background: #fff;       padding: 14px 18px;       border-radius: 10px;       margin-bottom: 18px;       border: 1px solid #e0e0e0;       display: flex;       gap: 12px;       align-items: center;       flex-wrap: wrap;     }     .filter-bar label { font-size: 14px; font-weight: 500; color: #333; }     .filter-bar input { padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }   </style> </head> <body>  <!-- ✅ แถบสถานะ + ปุ่มโหลด/ซิงค์/ส่งออก --> <div class="sync-bar">   <span class="sync-status" id="syncStatus">💾 ทำงานแบบออฟไลน์</span>   <div style="display:flex; gap:10px; flex-wrap:wrap;">     <button class="sync-btn" id="btnRefresh">📥 โหลดจากเซิร์ฟเวอร์</button>     <button class="sync-btn sync-upload" id="btnSyncAll">📤 ซิงค์ข้อมูลทั้งหมด</button>     <button class="sync-btn btn-export" id="btnExportCurrent">📥 ส่งออก Excel</button>   </div> </div>  <!-- ✅ แถบแจ้งเตือน --> <div class="alert-box" id="alertBox">   ℹ️ บันทึกข้อมูลทันที (ออฟไลน์) → กด "ซิงค์" เมื่อต้องการส่งขึ้น Google Sheets </div>  <!-- ✅ ปุ่มสแกน QR Code + ลบถัง --> <div class="top-buttons">   <button class="btn-main btn-scan" id="btnScanQR">📷 สแกน QR Code อ่านเลขถัง</button>   <button class="btn-main btn-danger-all hidden" id="btnDeleteTank">🗑️ ลบข้อมูลถังนี้</button> </div>  <!-- ✅ กล้องสแกน QR --> <div class="scan-box hidden" id="scanBox">   <button class="scan-close" id="btnCloseScan">×</button>   <video id="qrVideo" playsinline autoplay muted></video>   <canvas id="qrCanvas"></canvas>   <div class="scan-frame"></div>   <div class="scan-hint">วาง QR Code ให้อยู่ในกรอบ</div> </div>  <!-- ✅ ปุ่ม สลับรายงาน + แสดงจำนวนถัง --> <div class="view-tabs">   <button class="tab-btn" data-view="alltanks">📋 รายงานหมายเลขถังทั้งหมด <span class="tab-count" id="tabAllCount">0</span></button>   <button class="tab-btn" data-view="daily">📊 รายงานประจำวัน <span class="tab-count" id="tabDailyCount">0</span></button>   <button class="tab-btn" data-view="monthly">📈 รายงานประจำเดือน <span class="tab-count" id="tabMonthlyCount">0</span></button>   <button class="tab-btn active" data-view="all">📂 ข้อมูลถังทั้งหมด <span class="tab-count" id="tabTotalCount">0</span></button> </div>  <!-- ✅ ตัวกรองวันที่ รายงานประจำวัน --> <div class="filter-bar hidden" id="dailyFilter">   <label>📅 เลือกวันที่:</label>   <input type="date" id="selDate" />   <button class="sync-btn" id="btnShowDaily">🔍 แสดงข้อมูล</button> </div>  <!-- ✅ ตัวกรองเดือน รายงานประจำเดือน --> <div class="filter-bar hidden" id="monthlyFilter">   <label>📅 เลือกเดือน/ปี:</label>   <input type="month" id="selMonth" />   <button class="sync-btn" id="btnShowMonthly">🔍 แสดงข้อมูล</button> </div>  <!-- ✅ สรุปจำนวนถัง --> <div class="summary-bar hidden" id="summaryBar">   📋 ช่วง: <strong id="periodLabel">ทั้งหมด</strong> &nbsp;|&nbsp;   🛢️ จำนวนถังที่บันทึก: <strong id="tankCountPeriod">0</strong> ถัง &nbsp;|&nbsp;   ⏳ รอซิงค์: <strong id="pendingCount">0</strong> รายการ </div>  <!-- ✅ ฟอร์มบันทึกข้อมูล --> <div class="form-card" id="formCard">   <div class="form-grid" style="grid-template-columns: 1fr 1fr;">     <div class="form-group">       <label>เลขถังแก๊ส</label>       <input type="text" id="fSerial" placeholder="เช่น 001" />     </div>     <div class="form-group">       <label>บันทึกครั้งที่ (1-3)</label>       <input type="number" id="fRound" value="1" min="1" max="3" />     </div>   </div>    <div class="form-title">📋 ข้อมูลการอัดแก๊ส</div>   <div class="form-grid">     <div class="form-group">       <label>วันที่ (DD/MM/YYYY)</label>       <input type="text" id="fDate" placeholder="09/09/2026" />     </div>     <div class="form-group">       <label>น้ำหนักก่อนอัด/KG.</label>       <input type="number" step="0.01" id="fBefore" oninput="calcW()" />     </div>     <div class="form-group">       <label>น้ำหนักหลังอัด/KG.</label>       <input type="number" step="0.01" id="fAfter" oninput="calcW()" />     </div>     <div class="form-group">       <label>น้ำหนัก/KG.</label>       <input type="text" id="fWeight" readonly placeholder="อัตโนมัติ" />     </div>     <div class="form-group">       <label>แรงดัน/Bar</label>       <input type="number" step="0.01" id="fPress" />     </div>     <div class="form-group">       <label>CH4</label>       <input type="number" step="0.01" id="fCH4" />     </div>     <div class="form-group">       <label>CO2</label>       <input type="number" step="0.01" id="fCO2" />     </div>     <div class="form-group">       <label>H2S</label>       <input type="number" step="0.01" id="fH2S" />     </div>     <div class="form-group">       <label>Gas Meter Start</label>       <input type="number" step="0.01" id="fMStart" oninput="calcM()" />     </div>     <div class="form-group">       <label>Gas Meter Finish</label>       <input type="number" step="0.01" id="fMEnd" oninput="calcM()" />     </div>     <div class="form-group">       <label>รวม Gas Meter/M3</label>       <input type="text" id="fMTotal" readonly placeholder="อัตโนมัติ" />     </div>   </div>    <button class="save-btn" id="btnSave">💾 บันทึกข้อมูล (ออฟไลน์)</button> </div>  <!-- ✅ ตารางแสดงข้อมูล --> <div class="table-container" id="tableContainer"></div>  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script> <script> // ✅ ลิงก์ Apps Script const APPSCRIPT_URL = "https://script.google.com/macros/s/AKfycbyERQA2yj0c-2A01R0Vo5QG_NdXtCZdsqaGA9emfjiHjHfp4t3sU4nMqSgPrNDUg4BS/exec";  // ===== ข้อมูลหลัก ===== let tankDB = {};           // ข้อมูลถังทั้งหมด (รวมจากเซิร์ฟเวอร์ + ออฟไลน์) let pendingQueue = [];      // รายการรอซิงค์ไปยังเซิร์ฟเวอร์ let serverData = {};        // ข้อมูลที่โหลดจากเซิร์ฟเวอร์ let currentView = 'all'; let selectedDailyDate = null; let selectedMonth = null; let qrStream = null; let qrRunning = false;  // ===== เก็บข้อมูลลงเครื่อง ===== function saveToLocal() {   localStorage.setItem('tankDB', JSON.stringify(tankDB));   localStorage.setItem('pendingQueue', JSON.stringify(pendingQueue));   updateStatus(); }  // ===== โหลดข้อมูลจากเครื่อง ===== function loadFromLocal() {   try {     const db = localStorage.getItem('tankDB');     const pq = localStorage.getItem('pendingQueue');     if (db) tankDB = JSON.parse(db);     if (pq) pendingQueue = JSON.parse(pq);     updateStatus();   } catch(e) {     console.log("ไม่มีข้อมูลที่เก็บไว้");   } }  // ===== คำนวณอัตโนมัติ ===== window.calcW = () => {   const b = parseFloat(document.getElementById('fBefore').value)||0;   const a = parseFloat(document.getElementById('fAfter').value)||0;   document.getElementById('fWeight').value = (a-b).toFixed(2); }; window.calcM = () => {   const s = parseFloat(document.getElementById('fMStart').value)||0;   const e = parseFloat(document.getElementById('fMEnd').value)||0;   document.getElementById('fMTotal').value = (e-s).toFixed(2); };  // ===== แปลงวันที่ ===== function toDDMMYYYY(d) {   if (!d) return "";   const dt = d.includes('T') ? new Date(d) : new Date(d);   return isNaN(dt.getTime()) ? "" : `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`; } function ymdToDmy(s) { return s ? s.replace(/^(\d{4})-(\d{2})-(\d{2})$/,'$3/$2/$1') : ""; } function parseDateInput(val) {   if (!val) return null;   const m = String(val).trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);   if (m) {     const dt = new Date(parseInt(m[3]), parseInt(m[2])-1, parseInt(m[1]));     if (!isNaN(dt.getTime())) return toDDMMYYYY(dt);   }   return null; }  // ===== อัปเดตจำนวนถังทุกปุ่ม ===== function updateCounts() {   const total = Object.keys(tankDB).length;   document.getElementById('tabAllCount').textContent = total;   document.getElementById('tabTotalCount').textContent = total;   document.getElementById('pendingCount').textContent = pendingQueue.length;    if (selectedDailyDate) {     const dt = ymdToDmy(selectedDailyDate);     document.getElementById('tabDailyCount').textContent = Object.values(tankDB).filter(r=>r.some(x=>x.date===dt)).length;   } else document.getElementById('tabDailyCount').textContent = '0';    if (selectedMonth) {     const [y,m] = selectedMonth.split('-');     document.getElementById('tabMonthlyCount').textContent = Object.values(tankDB).filter(r=>r.some(x=>x.date.endsWith(`${m}/${y}`))).length;   } else document.getElementById('tabMonthlyCount').textContent = '0'; }  // ===== สถานะการเชื่อมต่อ ===== function updateStatus() {   const el = document.getElementById('syncStatus');   const pending = pendingQueue.length;   if (pending > 0) {     el.textContent = `⏳ รอซิงค์: ${pending} รายการ`;     el.className = 'sync-status pending';   } else {     el.textContent = '💾 ทำงานแบบออฟไลน์';     el.className = 'sync-status ok';   }   updateCounts(); }  // ===== 🔄 โหลดข้อมูลจากเซิร์ฟเวอร์ ===== async function loadFromServer() {   if (!APPSCRIPT_URL || APPSCRIPT_URL.includes('วางลิงก์')) {     alert("⚠️ ยังไม่ได้ตั้งค่าลิงก์ Apps Script");     return;   }   try {     document.getElementById('syncStatus').textContent = "🔄 กำลังโหลดจากเซิร์ฟเวอร์...";     const res = await fetch(APPSCRIPT_URL, {signal:AbortSignal.timeout(15000)});     if (!res.ok) throw new Error("ไม่ตอบสนอง");     const data = await res.json();     serverData = {};      // ===== แปลงข้อมูลตามโครงสร้างชีตจริง =====     for (let i=1; i<data.length; i++) {       const row = data[i], s = String(row[0]||"").trim();       if (!s) continue;       serverData[s] = [];       // ครั้งที่ 1: C-M → ดัชนี 2-12       if (row[2]) serverData[s].push(parseRow(row, 2, 1));       // ครั้งที่ 2: O-Y → ดัชนี 14-24       if (row[14]) serverData[s].push(parseRow(row, 14, 2));       // ครั้งที่ 3: AA-AK → ดัชนี 26-36       if (row[26]) serverData[s].push(parseRow(row, 26, 3));     }      // รวมข้อมูลเซิร์ฟเวอร์ + ข้อมูลออฟไลน์ที่ยังไม่ได้ซิงค์     tankDB = serverData;     pendingQueue.forEach(item=>{       if (!tankDB[item.serial]) tankDB[item.serial] = [];       tankDB[item.serial] = tankDB[item.serial].filter(r=>r.round!==item.round);       tankDB[item.serial].push(item);     });      saveToLocal();     alert(`✅ โหลดสำเร็จ: ${Object.keys(serverData).length} ถัง\nรอซิงค์อีก: ${pendingQueue.length} รายการ`);     renderTable();   } catch(e) {     alert("❌ โหลดไม่ได้: " + e.message + "\n(ทำงานต่อแบบออฟไลน์ได้ตามปกติ)");     updateStatus();   } }  // ===== แปลงแถวข้อมูล ===== function parseRow(row, startIdx, round) {   return {     serial: String(row[0]||"").trim(),     round: round,     date: row[startIdx]||"",     before: row[startIdx+1]||"",     after: row[startIdx+2]||"",     weight: row[startIdx+3]||"",     pressure: row[startIdx+4]||"",     ch4: row[startIdx+5]||"",     co2: row[startIdx+6]||"",     h2s: row[startIdx+7]||"",     meterStart: row[startIdx+8]||"",     meterEnd: row[startIdx+9]||"",     meterTotal: row[startIdx+10]||""   }; }  // ===== 📤 ซิงค์ข้อมูลทั้งหมดไปเซิร์ฟเวอร์ ===== async function syncAllPending() {   if (pendingQueue.length === 0) return alert("✅ ไม่มีข้อมูลรอซิงค์");   if (!confirm(`ยืนยันส่งข้อมูล ${pendingQueue.length} รายการขึ้นเซิร์ฟเวอร์?`)) return;    let success = 0, fail = 0;   for (let i=0; i<pendingQueue.length; i++) {     const item = pendingQueue[i];     try {       document.getElementById('syncStatus').textContent = `📤 กำลังซิงค์ ${i+1}/${pendingQueue.length}...`;       await fetch(APPSCRIPT_URL, {         method:"POST", mode:"no-cors",         headers:{"Content-Type":"application/json"},         body:JSON.stringify(item)       });       success++;     } catch { fail++; }   }    pendingQueue = [];   saveToLocal();   alert(`✅ ซิงค์สำเร็จ: ${success} รายการ${fail>0?`\n❌ ไม่สำเร็จ: ${fail} รายการ`:''}`);   await loadFromServer(); }  // ===== บันทึกข้อมูลลงเครื่อง (ไม่ส่งทันที) ===== function saveRec() {   const rec = {     serial: document.getElementById('fSerial').value.trim(),     round: parseInt(document.getElementById('fRound').value)||1,     date: parseDateInput(document.getElementById('fDate').value) || document.getElementById('fDate').value.trim(),     before: document.getElementById('fBefore').value,     after: document.getElementById('fAfter').value,     weight: document.getElementById('fWeight').value,     pressure: document.getElementById('fPress').value,     ch4: document.getElementById('fCH4').value,     co2: document.getElementById('fCO2').value,     h2s: document.getElementById('fH2S').value,     meterStart: document.getElementById('fMStart').value,     meterEnd: document.getElementById('fMEnd').value,     meterTotal: document.getElementById('fMTotal').value   };    if (!rec.serial || !rec.date) return alert("⚠️ กรุณากรอก เลขถัง และ วันที่");    // บันทึกลงฐานข้อมูลและคิวรอซิงค์   if (!tankDB[rec.serial]) tankDB[rec.serial] = [];   tankDB[rec.serial] = tankDB[rec.serial].filter(r=>r.round!==rec.round);   tankDB[rec.serial].push(rec);   pendingQueue = pendingQueue.filter(p=>!(p.serial===rec.serial && p.round===rec.round));   pendingQueue.push(rec);    saveToLocal();   alert("✅ บันทึกเรียบร้อย!\n(ข้อมูลเก็บที่เครื่อง กด \"ซิงค์\" เมื่อพร้อมส่งขึ้นเซิร์ฟเวอร์)");   clearForm();   renderTable(); }  // ===== ลบข้อมูลถัง ===== function deleteTank() {   const serial = document.getElementById('fSerial').value.trim();   if (!serial) return alert("⚠️ กรุณากรอกเลขถังก่อนลบ");   if (!tankDB[serial]) return alert("⚠️ ไม่พบข้อมูลถังนี้");   if (!confirm(`⚠️ ยืนยันลบข้อมูลถัง "${serial}" ทั้งหมด?\n(จะถูกลบเมื่อกดซิงค์)`)) return;    // เพิ่มคำสั่งลบลงคิว   pendingQueue.push({ serial, action:"DELETE" });   delete tankDB[serial];   saveToLocal();   alert("✅ ทำเครื่องหมายว่าต้องการลบแล้ว!\n(กด \"ซิงค์\" เพื่อลบจริงบนเซิร์ฟเวอร์)");   clearForm();   renderTable(); }  // ===== ล้างฟอร์ม ===== function clearForm() {   document.getElementById('fSerial').value=""; document.getElementById('fDate').value="";   ['fBefore','fAfter','fWeight','fPress','fCH4','fCO2','fH2S','fMStart','fMEnd','fMTotal'].forEach(id=>document.getElementById(id).value="");   document.getElementById('btnDeleteTank').classList.add('hidden'); }  // ===== สแกน QR Code ===== async function startScanQR() {   const box = document.getElementById('scanBox');   const video = document.getElementById('qrVideo');   const canvas = document.getElementById('qrCanvas');   box.classList.remove('hidden');    try {     qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });     video.srcObject = qrStream;     await video.play();     qrRunning = true;     scanQRFrame(video, canvas);   } catch(e) {     alert("❌ เปิดกล้องไม่ได้ — ตรวจสอบสิทธิ์กล้อง");     closeScanQR();   } }  function closeScanQR() {   qrRunning = false;   if (qrStream) { qrStream.getTracks().forEach(t=>t.stop()); qrStream=null; }   document.getElementById('scanBox').classList.add('hidden'); }  function scanQRFrame(video, canvas) {   if (!qrRunning) return;   const ctx = canvas.getContext('2d');   canvas.width = video.videoWidth; canvas.height = video.videoHeight;   ctx.drawImage(video,0,0);   const img = ctx.getImageData(0,0,canvas.width,canvas.height);   const code = jsQR(img.data,img.width,img.height);   if (code && code.data) {     document.getElementById('fSerial').value = code.data.trim();     document.getElementById('btnDeleteTank').classList.remove('hidden');     closeScanQR();     alert("✅ อ่านเลขถัง: " + code.data.trim());     return;   }   requestAnimationFrame(()=>scanQRFrame(video,canvas)); }  // ===== แสดงข้อความเมื่อไม่มีข้อมูล ===== function showHint(txt) {   document.getElementById('tableContainer').innerHTML = `<div style="padding:40px;text-align:center;color:#666;">📭 ${txt}</div>`; }  // ===== แสดงตารางข้อมูล ===== function renderTable() {   let filter = ()=>true, label = "ทั้งหมด";   document.getElementById('dailyFilter').classList.add('hidden');   document.getElementById('monthlyFilter').classList.add('hidden');   document.getElementById('summaryBar').classList.remove('hidden');    if (currentView==='daily') {     document.getElementById('dailyFilter').classList.remove('hidden');     if (!selectedDailyDate) return showHint("เลือกวันที่แล้วกด แสดงข้อมูล");     const dt = ymdToDmy(selectedDailyDate);     filter = r => r.date === dt;     label = `วันที่ ${dt}`;   }   if (currentView==='monthly') {     document.getElementById('monthlyFilter').classList.remove('hidden');     if (!selectedMonth) return showHint("เลือกเดือน/ปีแล้วกด แสดงข้อมูล");     const [y,m] = selectedMonth.split('-');     label = `เดือน ${m}/${y}`;     filter = r => r.date.endsWith(`${m}/${y}`);   }    // ===== รวบรวมข้อมูลตามเงื่อนไข =====   const list = Object.entries(tankDB).sort((a,b)=>a[0].localeCompare(b[0])).map(([s,rs])=>{     const r1 = rs.find(x=>filter(x)&&x.round===1)||null;     const r2 = rs.find(x=>filter(x)&&x.round===2)||null;     const r3 = rs.find(x=>filter(x)&&x.round===3)||null;     if (r1||r2||r3||label==="ทั้งหมด") return {s,r1,r2,r3};     return null;   }).filter(Boolean);    // อัปเดตสรุป   document.getElementById('periodLabel').textContent = label;   document.getElementById('tankCountPeriod').textContent = list.length;   if (currentView==='daily') document.getElementById('tabDailyCount').textContent = list.length;   if (currentView==='monthly') document.getElementById('tabMonthlyCount').textContent = list.length;    if (!list.length) return showHint(`ไม่พบข้อมูล — ${label}`);    // ===== หัวตาราง =====   let html = `<table>     <thead>       <tr style="background:#0d47a1;color:white;">         <th rowspan="2">เลขถังแก๊ส</th>         <th colspan="11">ครั้งที่ 1</th>         <th colspan="11">ครั้งที่ 2</th>         <th colspan="11">ครั้งที่ 3</th>         <th rowspan="2">รวมน้ำหนัก/KG.</th>       </tr>       <tr style="background:#1565c0;color:white;">         <th>วันที่</th><th>น้ำหนักก่อนอัด/KG.</th><th>น้ำหนักหลังอัด/KG.</th><th>น้ำหนักครั้งที่ 1/KG.</th><th>แรงดัน/Bar</th><th>CH4</th><th>CO2</th><th>H2S</th><th>Gas Meter Start</th><th>Gas Meter Finish</th><th>รวม Gas Meter/M3</th>         <th>วันที่</th><th>น้ำหนักก่อนอัด/KG.</th><th>น้ำหนักหลังอัด/KG.</th><th>น้ำหนักครั้งที่ 2/KG.</th><th>แรงดัน/Bar</th><th>CH4</th><th>CO2</th><th>H2S</th><th>Gas Meter Start</th><th>Gas Meter Finish</th><th>รวม Gas Meter/M3</th>         <th>วันที่</th><th>น้ำหนักก่อนอัด/KG.</th><th>น้ำหนักหลังอัด/KG.</th><th>น้ำหนักครั้งที่ 3/KG.</th><th>แรงดัน/Bar</th><th>CH4</th><th>CO2</th><th>H2S</th><th>Gas Meter Start</th><th>Gas Meter Finish</th><th>รวม Gas Meter/M3</th>       </tr>     </thead><tbody>`;    // ===== แสดงข้อมูลแถว =====   list.forEach(({s,r1,r2,r3})=>{     const w = (parseFloat(r1?.weight)||0)+(parseFloat(r2?.weight)||0)+(parseFloat(r3?.weight)||0);     const td = (x,f='date')=>x?(f==='weight'?`<td class="weight-cell">${x[f]}</td>`:`<td>${x[f]}</td>`):'<td>-</td>';     html += `<tr><td class="serial-cell" onclick="loadTankData('${s}')">${s}</td>       ${td(r1,'date')}${td(r1,'before')}${td(r1,'after')}${td(r1,'weight')}${td(r1,'pressure')}${td(r1,'ch4')}${td(r1,'co2')}${td(r1,'h2s')}${td(r1,'meterStart')}${td(r1,'meterEnd')}${td(r1,'meterTotal')}       ${td(r2,'date')}${td(r2,'before')}${td(r2,'after')}${td(r2,'weight')}${td(r2,'pressure')}${td(r2,'ch4')}${td(r2,'co2')}${td(r2,'h2s')}${td(r2,'meterStart')}${td(r2,'meterEnd')}${td(r2,'meterTotal')}       ${td(r3,'date')}${td(r3,'before')}${td(r3,'after')}${td(r3,'weight')}${td(r3,'pressure')}${td(r3,'ch4')}${td(r3,'co2')}${td(r3,'h2s')}${td(r3,'meterStart')}${td(r3,'meterEnd')}${td(r3,'meterTotal')}       <td class="total-kg">${w.toFixed(2)}</td></tr>`;   });    html += `</tbody></table>`;   document.getElementById('tableContainer').innerHTML = html;   updateCounts(); }  // ===== โหลดข้อมูลถังลงฟอร์ม ===== window.loadTankData = function(s) {   document.getElementById('fSerial').value = s;   document.getElementById('btnDeleteTank').classList.remove('hidden');   alert(`✅ เลือกถัง "${s}" แล้ว — กรอกข้อมูลเพิ่มหรือกดลบได้เลย`); }  // ===== ส่งออก Excel ===== function exportExcel() {   const header = [     "เลขถังแก๊ส",     "ครั้งที่ 1 - วันที่", "น้ำหนักก่อนอัด/KG.", "น้ำหนักหลังอัด/KG.", "น้ำหนักครั้งที่ 1/KG.", "แรงดัน/Bar", "CH4", "CO2", "H2S", "Gas Meter Start", "Gas Meter Finish", "รวม Gas Meter/M3",     "ครั้งที่ 2 - วันที่", "น้ำหนักก่อนอัด/KG.", "น้ำหนักหลังอัด/KG.", "น้ำหนักครั้งที่ 2/KG.", "แรงดัน/Bar", "CH4", "CO2", "H2S", "Gas Meter Start", "Gas Meter Finish", "รวม Gas Meter/M3",     "ครั้งที่ 3 - วันที่", "น้ำหนักก่อนอัด/KG.", "น้ำหนักหลังอัด/KG.", "น้ำหนักครั้งที่ 3/KG.", "แรงดัน/Bar", "CH4", "CO2", "H2S", "Gas Meter Start", "Gas Meter Finish", "รวม Gas Meter/M3",     "รวมน้ำหนัก/KG."   ];   const rows = [header];   Object.entries(tankDB).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([s,rs])=>{     const r1=rs.find(x=>x.round===1)||{};     const r2=rs.find(x=>x.round===2)||{};     const r3=rs.find(x=>x.round===3)||{};     const w=((parseFloat(r1.weight)||0)+(parseFloat(r2.weight)||0)+(parseFloat(r3.weight)||0)).toFixed(2);     rows.push([s,       r1.date||'',r1.before||'',r1.after||'',r1.weight||'',r1.pressure||'',r1.ch4||'',r1.co2||'',r1.h2s||'',r1.meterStart||'',r1.meterEnd||'',r1.meterTotal||'',       r2.date||'',r2.before||'',r2.after||'',r2.weight||'',r2.pressure||'',r2.ch4||'',r2.co2||'',r2.h2s||'',r2.meterStart||'',r2.meterEnd||'',r2.meterTotal||'',       r3.date||'',r3.before||'',r3.after||'',r3.weight||'',r3.pressure||'',r3.ch4||'',r3.co2||'',r3.h2s||'',r3.meterStart||'',r3.meterEnd||'',r3.meterTotal||'',w]);   });   const wb = XLSX.utils.book_new();   XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), "ข้อมูลถังแก๊ส");   XLSX.writeFile(wb, "รายงานถังแก๊ส_"+toDDMMYYYY(new Date()).replace(/\//g,'-')+".xlsx"); }  // ===== ตรวจสอบเมื่อพิมพ์เลขถัง ===== document.addEventListener('DOMContentLoaded', ()=>{   document.getElementById('fSerial').addEventListener('input', e=>{     const s = e.target.value.trim();     document.getElementById('btnDeleteTank').classList.toggle('hidden', !s);   }); });  // ===== เริ่มทำงานเมื่อโหลดหน้า ===== document.addEventListener('DOMContentLoaded', ()=>{   // โหลดข้อมูลที่เก็บไว้ในเครื่องก่อน   loadFromLocal();    // ปุ่มสลับรายงาน   document.querySelectorAll('.tab-btn').forEach(b=>{     b.onclick = ()=>{       document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));       b.classList.add('active');       currentView = b.dataset.view;       renderTable();     };   });    // ปุ่มทำงาน   document.getElementById('btnRefresh').onclick = loadFromServer;   document.getElementById('btnSyncAll').onclick = syncAllPending;   document.getElementById('btnSave').onclick = saveRec;   document.getElementById('btnExportCurrent').onclick = exportExcel;   document.getElementById('btnScanQR').onclick = startScanQR;   document.getElementById('btnCloseScan').onclick = closeScanQR;   document.getElementById('btnDeleteTank').onclick = deleteTank;    // วันที่ รายงานประจำวัน   document.getElementById('selDate').onchange = e=>{ selectedDailyDate = e.target.value; };   document.getElementById('btnShowDaily').onclick = ()=>{ selectedDailyDate = document.getElementById('selDate').value; renderTable(); };    // เดือน รายงานประจำเดือน   document.getElementById('selMonth').onchange = e=>{ selectedMonth = e.target.value; };   document.getElementById('btnShowMonthly').onclick = ()=>{ selectedMonth = document.getElementById('selMonth').value; renderTable(); };    renderTable(); }); </script> </body> </html>
