<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ทะเบียนถังแก๊ส — Cenergy Solutions</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: "Segoe UI", sans-serif; margin: 0; padding: 0; }
    body { background: #f0f4f8; padding: 16px; max-width: 1200px; margin: 0 auto; color: #333; }

    .sync-bar {
      background: #e8f7ff;
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border: 1px solid #b3e5fc;
    }
    .sync-status { font-size: 14px; color: #0277bd; display: flex; align-items: center; gap: 8px; }
    .sync-status.err { color: #d32f2f; }
    .sync-status.ok { color: #2e7d32; }
    .sync-btn { padding: 10px 22px; background: #1976d2; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .sync-btn:hover { background: #1565c0; }
    .btn-export { background: #2e7d32; color: white; }
    .btn-export:hover { background: #27692a; }
    .btn-admin { background: #6a1b9a; color: white; }
    .btn-admin:hover { background: #4a148c; }
    .btn-danger-all { background: #c62828; color: white; }
    .btn-danger-all:hover { background: #b71c1c; }
    .btn-search { background: #ff8f00; color: white; }
    .btn-search:hover { background: #e68200; }
    .btn-new { background: #0288d1; color: white; }
    .btn-new:hover { background: #0277bd; }

    .alert-box { background: #fff3e0; border: 1px solid #ffe0b2; border-radius: 10px; padding: 12px 16px; margin-bottom: 18px; font-size: 14px; line-height: 1.6; color: #e65100; }
    .mode-indicator { background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-weight: 500; color: #2e7d32; }

    .top-buttons { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .btn-main { padding: 12px 20px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 500; }

    .admin-bar { background: #f3e5f5; border: 1px solid #ce93d8; border-radius: 10px; padding: 14px 18px; margin-bottom: 18px; }
    .admin-bar.hidden { display: none; }
    .admin-title { font-weight: 600; color: #4a148c; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .admin-input-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .admin-input { flex: 1; min-width: 200px; padding: 10px 12px; border: 1px solid #ce93d8; border-radius: 6px; font-size: 15px; }

    .view-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { padding: 12px 18px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; background: #fff; color: #555; border: 1px solid #ddd; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .tab-btn.active { background: #e3f2fd; color: #1976d2; border-color: #90caf9; font-weight: 500; }
    .tab-btn:hover:not(.active) { background: #f5f5f5; border-color: #bbb; }
    .tab-count { background: #1976d2; color: white; font-size: 13px; padding: 2px 10px; border-radius: 12px; margin-left: 6px; min-width: 28px; text-align: center; }
    .tab-btn.active .tab-count { background: #1565c0; }

    .summary-bar { background: #e8f5e9; padding: 14px 18px; border-radius: 10px; margin-bottom: 14px; border: 1px solid #c8e6c9; font-size: 15px; }
    .hidden { display: none !important; }

    .form-card { background: #fafafa; padding: 22px; border-radius: 10px; margin-bottom: 18px; border: 1px solid #e0e0e0; }
    .form-title { font-size: 16px; font-weight: 600; margin: 14px 0 10px 0; color: #1976d2; border-bottom: 2px solid #1976d2; padding-bottom: 6px; }
    .form-section { margin-bottom: 18px; border: 1px solid #e0e0e0; border-radius: 8px; padding: 14px; background: #fff; }
    .form-section-title { font-weight: 600; color: #1565c0; margin-bottom: 12px; font-size: 15px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .form-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 12px; }
    .form-group { display: flex; flex-direction: column; flex: 1; min-width: 140px; }
    label { font-size: 13px; color: #555; margin-bottom: 5px; }
    input { padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; background: #fff; }
    input:focus { outline: none; border-color: #1976d2; box-shadow: 0 0 0 3px rgba(25,118,210,0.1); }
    input[readonly] { background: #f5f5f5; color: #1565c0; font-weight: 500; }
    .calc-note { font-size: 12px; color: #1976d2; margin-top: 4px; }
    .save-btn { width: 100%; background: #1976d2; color: white; border: none; padding: 15px; font-size: 17px; border-radius: 10px; cursor: pointer; margin-top: 10px; font-weight: 500; }
    .save-btn:hover { background: #1565c0; }

    .filter-bar { background: #fff; padding: 14px 18px; border-radius: 10px; margin-bottom: 18px; border: 1px solid #e0e0e0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .filter-bar label { font-size: 14px; font-weight: 500; color: #333; }

    table { width: 100%; border-collapse: collapse; font-size: 11px; white-space: nowrap; }
    th { background: #1976d2; color: white; padding: 7px 3px; text-align: center; border: 1px solid #1565c0; font-weight: 500; font-size: 10px; }
    td { padding: 6px 3px; text-align: center; border: 1px solid #e0e0e0; }

    .weight-cell { font-weight: bold; color: #e65100; }

        <div class="form-group"><label>น้ำหนักหลังอัด/KG.</label><input type="number" step="0.01" id="r2_after" oninput="calcW2()" /></div>

<div class="view-tabs">

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
// ✅ ลิงก์ใหม่ — ใช้งานได้แล้วครับ
const APPSCRIPT_URL = "https://script.google.com/macros/s/AKfycbx_xJW5KEXSA0k2wiVioWaW9sKRCzwkextjjH3WfhVYcpXSD7BjSABTfhPA2jLuCcmZ/exec";

const ADMIN_PASSWORD = "admin123!";
const CLEARALL_PASSWORD = "clear999";

let tankDB = {};
let currentView = 'all';
let selectedDailyDate = null;
let selectedMonth = null;
let isAdmin = false;
let CURRENT_SERIAL = null;

// ===== คำนวณอัตโนมัติ แต่ละครั้ง =====
window.calcW1 = () => { const b=parseFloat(document.getElementById('r1_before').value)||0,a=parseFloat(document.getElementById('r1_after').value)||0; document.getElementById('r1_weight').value=(a-b).toFixed(2); };
window.calcW2 = () => { const b=parseFloat(document.getElementById('r2_before').value)||0,a=parseFloat(document.getElementById('r2_after').value)||0; document.getElementById('r2_weight').value=(a-b).toFixed(2); };
window.calcW3 = () => { const b=parseFloat(document.getElementById('r3_before').value)||0,a=parseFloat(document.getElementById('r3_after').value)||0; document.getElementById('r3_weight').value=(a-b).toFixed(2); };
window.calcM1 = () => { const s=parseFloat(document.getElementById('r1_mStart').value)||0,e=parseFloat(document.getElementById('r1_mEnd').value)||0; document.getElementById('r1_mTotal').value=(e-s).toFixed(2); };
window.calcM2 = () => { const s=parseFloat(document.getElementById('r2_mStart').value)||0,e=parseFloat(document.getElementById('r2_mEnd').value)||0; document.getElementById('r2_mTotal').value=(e-s).toFixed(2); };
window.calcM3 = () => { const s=parseFloat(document.getElementById('r3_mStart').value)||0,e=parseFloat(document.getElementById('r3_mEnd').value)||0; document.getElementById('r3_mTotal').value=(e-s).toFixed(2); };

// ===== แปลงวันที่ =====
function toDDMMYYYY(d) { if(!d)return""; const dt=d.includes('T')?new Date(d):new Date(d); return isNaN(dt.getTime())?"":`${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`; }
function ymdToDmy(s) { return s?s.replace(/^(\d{4})-(\d{2})-(\d{2})$/,'$3/$2/$1'):""; }
function parseDateInput(val) { if(!val)return null; const m=String(val).trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/); if(m){const dt=new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1]));if(!isNaN(dt.getTime()))return toDDMMYYYY(dt);} return null; }

// ===== อัปเดตจำนวน =====
function updateCounts() {
  const total=Object.keys(tankDB).length;
  document.getElementById('tabAllCount').textContent=total;
  document.getElementById('tabTotalCount').textContent=total;
  if(selectedDailyDate){const dt=ymdToDmy(selectedDailyDate); document.getElementById('tabDailyCount').textContent=Object.values(tankDB).filter(r=>r.some(x=>x.date===dt)).length;}
  else document.getElementById('tabDailyCount').textContent='0';
  if(selectedMonth){const [y,m]=selectedMonth.split('-'); document.getElementById('tabMonthlyCount').textContent=Object.values(tankDB).filter(r=>r.some(x=>x.date.endsWith(`${m}/${y}`))).length;}
  else document.getElementById('tabMonthlyCount').textContent='0';
}

function setStatus(txt,type='info'){const el=document.getElementById('syncStatus');el.textContent=txt;el.className='sync-status';if(type==='ok')el.classList.add('ok');if(type==='err')el.classList.add('err');}

// ===== โหลดข้อมูล =====
async function loadData(){
  if(!APPSCRIPT_URL||APPSCRIPT_URL.includes('วางลิงก์')){setStatus("⚠️ ยังไม่ได้ตั้งค่าลิงก์ Apps Script",'err');return;}
  try{
    setStatus("🔄 กำลังเชื่อมต่อ Google Sheets...");
    const res=await fetch(APPSCRIPT_URL,{signal:AbortSignal.timeout(30000)});
    setStatus("📥 กำลังอ่านข้อมูล...");
    if(!res.ok)throw new Error("ไม่ตอบสนอง");
    const result=await res.json();
    if(!result.success)throw new Error(result.error||"โหลดข้อมูลไม่สำเร็จ");
    tankDB={}; const data=result.data||[];
    setStatus("📋 กำลังประมวลผล...");
    for(let i=1;i<data.length;i++){
      const row=data[i],s=String(row[0]||"").trim();if(!s)continue;
      tankDB[s]=[];
      for(let r=1;r<=3;r++){
        const o=(r-1)*11+1;
        if(row[o]){
          tankDB[s].push({serial:s,round:r,date:row[o],before:row[o+1],after:row[o+2],weight:row[o+3],pressure:row[o+4],ch4:row[o+5],co2:row[o+6],h2s:row[o+7],meterStart:row[o+8],meterEnd:row[o+9],meterTotal:row[o+10]});
        }
      }
    }
    setStatus(`✅ ซิงค์สำเร็จ — ${Object.keys(tankDB).length} ถัง`,'ok');
    updateCounts();renderTable();
  }catch(e){console.error(e);
    if(e.name==="TimeoutError")setStatus("⏱️ เชื่อมต่อช้า — กด โหลดข้อมูลอีกครั้ง",'err');
    else setStatus("⚠️ โหลดไม่ได้ — "+e.message,'err');
  }
}

// ===== ✅ เพิ่มถังใหม่ — ล้างฟอร์ม เปิดฟอร์ม =====
function newTank(){
  CURRENT_SERIAL = null;
  document.getElementById('fSerial').value="";

function searchTank(){
  const serial=document.getElementById('fSerial').value.trim();
  if(!serial)return alert("⚠️ กรุณากรอกเลขถังแก๊ส");
  CURRENT_SERIAL = serial;

  if(!tankDB[serial]){

}

// ===== ✅ บันทึกข้อมูลทั้งหมด 3 ครั้ง =====
async function saveRec(){
  const serial = (CURRENT_SERIAL || document.getElementById('fSerial').value.trim());
  if(!serial) return alert("⚠️ กรุณากรอกเลขถังแก๊ส");

  const roundsData = [];
  for(let r=1; r<=3; r++){
    const d=document.getElementById(`r${r}_date`).value.trim();
    if(d){
      roundsData.push({
        serial:serial,
        round:r,
        date: parseDateInput(d) || d,
        before: document.getElementById(`r${r}_before`).value,
        after: document.getElementById(`r${r}_after`).value,
        weight: document.getElementById(`r${r}_weight`).value,
        pressure: document.getElementById(`r${r}_press`).value,
        ch4: document.getElementById(`r${r}_ch4`).value,
        co2: document.getElementById(`r${r}_co2`).value,
        h2s: document.getElementById(`r${r}_h2s`).value,
        meterStart: document.getElementById(`r${r}_mStart`).value,
        meterEnd: document.getElementById(`r${r}_mEnd`).value,
        meterTotal: document.getElementById(`r${r}_mTotal`).value
      });
    }
  }

  if(roundsData.length===0) return alert("⚠️ กรุณากรอกข้อมูลอย่างน้อย 1 ครั้ง");

  try {
    setStatus(`⏳ กำลังบันทึก ${roundsData.length} ครั้ง...`);
    let successCount=0, failCount=0;

    for(const rec of roundsData){
      const res=await fetch(APPSCRIPT_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(rec)
      });
      if(res.ok){
        const result=await res.json();
        if(result.success) successCount++;
        else failCount++;
      } else failCount++;
    }

    if(failCount===0){
      alert(`✅ บันทึกสำเร็จทั้งหมด ${successCount} ครั้ง!`);
      document.getElementById('fSerial').value="";
      document.getElementById('dataForm').classList.add('hidden');
      document.getElementById('modeIndicator').textContent="📝 โหมด: รอการค้นหาหรือเพิ่มถังใหม่";
      CURRENT_SERIAL=null;
      setStatus("✅ บันทึกสำเร็จ",'ok');
      loadData();
    } else {
      alert(`⚠️ บันทึกสำเร็จ ${successCount} ครั้ง ไม่สำเร็จ ${failCount} ครั้ง`);
      setStatus("⚠️ บันทึกบางรายการไม่สำเร็จ",'err');
    }
  } catch(err){
    console.error(err);
    alert("❌ ผิดพลาด: "+err.message);
    setStatus("❌ "+err.message,'err');
  }
}

// ===== ลบข้อมูลทั้งหมด =====
async function clearAllData(){
  const pass=prompt("⚠️ กรุณากรอกรหัสยืนยันเพื่อลบข้อมูลทั้งหมด:");
  if(pass!==CLEARALL_PASSWORD)return alert("❌ รหัสผ่านไม่ถูกต้อง");
  if(!confirm("⚠️ คุณแน่ใจหรือไม่ที่จะลบประวัติการอัดแก๊สทั้งหมด? การกระทำนี้ไม่สามารถกู้คืนได้!"))return;
  try{
    setStatus("🗑️ กำลังลบข้อมูล...");
    const res=await fetch(APPSCRIPT_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"CLEAR_ALL",password:CLEARALL_PASSWORD})});
    const result=await res.json();
    if(result.success){alert("✅ ลบข้อมูลทั้งหมดสำเร็จ!");tankDB={};renderTable();updateCounts();setStatus("✅ ลบข้อมูลเรียบร้อย",'ok');}
    else alert("❌ ไม่สำเร็จ: "+(result.error||"รหัสผ่านไม่ถูกต้อง"));
  }catch{alert("❌ ไม่สามารถลบข้อมูลได้");}
}

// ===== แสดงตาราง =====
function renderTable(){
  let filter=()=>true, label="ทั้งหมด";
  document.getElementById('dailyFilter').classList.add('hidden');
  document.getElementById('monthlyFilter').classList.add('hidden');
  document.getElementById('summaryBar').classList.add('hidden');
  if(currentView==='daily'){
    document.getElementById('dailyFilter').classList.remove('hidden');
    if(!selectedDailyDate)return showHint("เลือกวันที่แล้วกด แสดงข้อมูล");
    const dt=ymdToDmy(selectedDailyDate);
    filter=r=>r.date===dt; label=`วันที่ ${dt}`;
  }
  if(currentView==='monthly'){
    document.getElementById('monthlyFilter').classList.remove('hidden');
    if(!selectedMonth)return showHint("เลือกเดือน/ปีแล้วกด แสดงข้อมูล");
    const [y,m]=selectedMonth.split('-'); label=`เดือน ${m}/${y}`;
    filter=r=>r.date.endsWith(`${m}/${y}`);
  }
  const list=Object.entries(tankDB).sort((a,b)=>a[0].localeCompare(b[0])).map(([s,rs])=>{
    const r1=rs.find(x=>filter(x)&&x.round===1)||null;
    const r2=rs.find(x=>filter(x)&&x.round===2)||null;
    const r3=rs.find(x=>filter(x)&&x.round===3)||null;
    if(r1||r2||r3||label==="ทั้งหมด")return {s,r1,r2,r3};
    return null;
  }).filter(Boolean);
  document.getElementById('summaryBar').classList.remove('hidden');
  document.getElementById('periodLabel').textContent=label;
  document.getElementById('tankCountPeriod').textContent=list.length;
  if(currentView==='daily')document.getElementById('tabDailyCount').textContent=list.length;
  if(currentView==='monthly')document.getElementById('tabMonthlyCount').textContent=list.length;
  if(!list.length)return showHint(`ไม่พบข้อมูล — ${label}`);

  let html=`<table><thead><tr style="background:#0d47a1;color:white;"><th rowspan="2">เลขถังแก๊ส</th><th colspan="11">ครั้งที่ 1</th><th colspan="11">ครั้งที่ 2</th><th colspan="11">ครั้งที่ 3</th><th rowspan="2">รวมน้ำหนัก/KG.</th></tr><tr style="background:#1565c0;color:white;"><th>วันที่</th><th>ก่อน/KG.</th><th>หลัง/KG.</th><th>น้ำหนัก/KG.</th><th>แรงดัน</th><th>CH4</th><th>CO2</th><th>H2S</th><th>Meter Start</th><th>Meter Finish</th><th>รวม/M3</th><th>วันที่</th><th>ก่อน/KG.</th><th>หลัง/KG.</th><th>น้ำหนัก/KG.</th><th>แรงดัน</th><th>CH4</th><th>CO2</th><th>H2S</th><th>Meter Start</th><th>Meter Finish</th><th>รวม/M3</th><th>วันที่</th><th>ก่อน/KG.</th><th>หลัง/KG.</th><th>น้ำหนัก/KG.</th><th>แรงดัน</th><th>CH4</th><th>CO2</th><th>H2S</th><th>Meter Start</th><th>Meter Finish</th><th>รวม/M3</th></tr></thead><tbody>`;
  list.forEach(({s,r1,r2,r3})=>{
    const w=((parseFloat(r1?.weight)||0)+(parseFloat(r2?.weight)||0)+(parseFloat(r3?.weight)||0)).toFixed(2);
    const td=(x,f='date')=>x?(f==='weight'?`<td class="weight-cell">${x[f]}</td>`:`<td>${x[f]}</td>`):'<td>-</td>';
    html+=`<tr><td class="serial-cell">${s}</td>${td(r1,'date')}${td(r1,'before')}${td(r1,'after')}${td(r1,'weight')}${td(r1,'pressure')}${td(r1,'ch4')}${td(r1,'co2')}${td(r1,'h2s')}${td(r1,'meterStart')}${td(r1,'meterEnd')}${td(r1,'meterTotal')}${td(r2,'date')}${td(r2,'before')}${td(r2,'after')}${td(r2,'weight')}${td(r2,'pressure')}${td(r2,'ch4')}${td(r2,'co2')}${td(r2,'h2s')}${td(r2,'meterStart')}${td(r2,'meterEnd')}${td(r2,'meterTotal')}${td(r3,'date')}${td(r3,'before')}${td(r3,'after')}${td(r3,'weight')}${td(r3,'pressure')}${td(r3,'ch4')}${td(r3,'co2')}${td(r3,'h2s')}${td(r3,'meterStart')}${td(r3,'meterEnd')}${td(r3,'meterTotal')}<td class="total-kg">${w}</td></tr>`;
  });
  html+=`</tbody></table>`;
  document.getElementById('tableContainer').innerHTML=html;
  updateCounts();
}
