<script>
// 🔑 รหัสผ่าน
const PASSWORD_DEL_ROUND1 = "del123";
const PASSWORD_CLEAR_ALL = "clear999";

let editMode = false;
let tankDB = {}; // เก็บข้อมูลในหน่วยความจำ
let currentSerial = null;
let currentView = 'single';
let videoStream = null;
const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');

// ⚙️ ลิงก์ Google Apps Script (อาจยังไม่ใช้งานได้จริง จึงมีระบบสำรอง)
const APPSCRIPT_URL = "https://script.google.com/macros/s/AKfycbyhApPZRt1_HMtEUqkPa0its2izh2kIlljgqTTzZUj-gTmyF6DzWEzeGREAB5x_DPEn/exec";
let apiAvailable = false; // สถานะการเชื่อมต่อ API

// ===== แปลงวันที่เป็น DD/MM/YYYY =====
function toDDMMYYYY(date) {
  if (!date) return "";
  let d;
  if (typeof date === 'string' && date.includes('T')) {
    d = new Date(date);
  } else {
    d = new Date(date);
  }
  if (isNaN(d.getTime())) return "";
  const day = String(d.getDate()).padStart(2, '0');
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const year = d.getFullYear();
  return `${day}/${month}/${year}`;
}

function parseDateInput(val) {
  if (!val) return null;
  const clean = String(val).trim().split('T')[0].split(' ')[0];
  const m = clean.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m) {
    const day = parseInt(m[1]);
    const month = parseInt(m[2]);
    const year = parseInt(m[3]);
    const date = new Date(year, month - 1, day);
    if (!isNaN(date.getTime())) {
      return toDDMMYYYY(date);
    }
  }
  return null;
}

// ===== 📋 สร้างแถวตารางตามรูปแบบมาตรฐาน =====
function buildStandardRow(serial, r1, r2, r3) {
  const w1 = parseFloat(r1?.weight)||0;
  const w2 = parseFloat(r2?.weight)||0;

  return `
    <tr>
      <td class="tank-col">${serial}</td>
      <td>1</td>
      <td>${r1?.date||'-'}</td>
      <td>${r1?.before||'-'}</td>
      <td>${r1?.after||'-'}</td>
      <td class="calc-cell">${r1?.weight||'-'}</td>
      <td>${r1?.pressure||'-'}</td>
      <td>${r1?.ch4||'-'}</td>
      <td>${r1?.co2||'-'}</td>
      <td>${r1?.h2s||'-'}</td>
      <td>${r1?.meterStart||'-'}</td>
      <td>${r1?.meterEnd||'-'}</td>
      <td class="calc-cell">${r1?.meterTotal||'-'}</td>
      <td>2</td>
      <td>${r2?.date||'-'}</td>
      <td>${r2?.before||'-'}</td>
      <td>${r2?.after||'-'}</td>
      <td class="calc-cell">${r2?.weight||'-'}</td>
      <td>${r2?.pressure||'-'}</td>
      <td>${r2?.ch4||'-'}</td>
      <td>${r2?.co2||'-'}</td>
      <td>${r2?.h2s||'-'}</td>
      <td>${r2?.meterStart||'-'}</td>
      <td>${r2?.meterEnd||'-'}</td>
      <td class="calc-cell">${r2?.meterTotal||'-'}</td>
      <td>3</td>
      <td>${r3?.date||'-'}</td>
      <td>${r3?.before||'-'}</td>
      <td>${r3?.after||'-'}</td>
      <td class="calc-cell">${r3?.weight||'-'}</td>
      <td>${r3?.pressure||'-'}</td>
      <td>${r3?.ch4||'-'}</td>
      <td>${r3?.co2||'-'}</td>
      <td>${r3?.h2s||'-'}</td>
      <td>${r3?.meterStart||'-'}</td>
      <td>${r3?.meterEnd||'-'}</td>
      <td class="calc-cell">${r3?.meterTotal||'-'}</td>
      <td class="total-cell">${totalKG}</td>
    </tr>`;
}

// ===== 📋 หัวตารางมาตรฐาน =====
function standardTableHeader() {
  return `
    <table>
      <thead>
        <tr>
          <th rowspan="2">เลขถังแก๊ส</th>
          <th colspan="13" class="sub-col">ครั้งที่ 1</th>
          <th colspan="13" class="sub-col">ครั้งที่ 2</th>
          <th colspan="13" class="sub-col">ครั้งที่ 3</th>
          <th rowspan="2">รวมน้ำหนัก</th>
        </tr>
        <tr>
          <th>ครั้งที่</th><th>วันที่</th><th>ก่อนอัด</th><th>หลังอัด</th><th>น้ำหนักรวม</th><th>แรงดัน</th><th>CH4</th><th>CO2</th><th>H2S</th><th>Meter Start</th><th>Meter Finish</th><th>Meter/M3</th>
          <th>ครั้งที่</th><th>วันที่</th><th>ก่อนอัด</th><th>หลังอัด</th><th>น้ำหนักรวม</th><th>แรงดัน</th><th>CH4</th><th>CO2</th><th>H2S</th><th>Meter Start</th><th>Meter Finish</th><th>Meter/M3</th>
          <th>ครั้งที่</th><th>วันที่</th><th>ก่อนอัด</th><th>หลังอัด</th><th>น้ำหนักรวม</th><th>แรงดัน</th><th>CH4</th><th>CO2</th><th>H2S</th><th>Meter Start</th><th>Meter Finish</th><th>Meter/M3</th>
        </tr>
      </thead>
      <tbody>`;
}

document.addEventListener('DOMContentLoaded', function() {

  window.calcWeight = function() {
    const b = parseFloat(document.getElementById('fBefore').value) || 0;
    const a = parseFloat(document.getElementById('fAfter').value) || 0;
    document.getElementById('fWeight').value = (a - b).toFixed(2);
  };
  window.calcMeter = function() {
    const s = parseFloat(document.getElementById('fMStart').value) || 0;
    const e = parseFloat(document.getElementById('fMEnd').value) || 0;
    document.getElementById('fMTotal').value = (e - s).toFixed(2);
  };

  function setStatus(text, type = 'info') {
    const el = document.getElementById('syncStatus');
    el.textContent = text;
    el.className = "sync-status";
    if (type === 'ok') el.classList.add('ok');
    if (type === 'err') el.classList.add('err');
  }

  // ===== ทดสอบการเชื่อมต่อ API =====
  async function checkAPI() {
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 5000);
      const res = await fetch(APPSCRIPT_URL, { 
        method: 'GET', 
        signal: controller.signal 
      });
      clearTimeout(timeout);
      if (res.ok) {
        apiAvailable = true;
        setStatus("✅ เชื่อมต่อระบบออนไลน์ — พร้อมซิงค์", 'ok');
        return true;
      }
    } catch (e) {
      console.log("API ไม่พร้อมใช้งาน:", e.message);
    }
    apiAvailable = false;
    setStatus("⚠️ ทำงานแบบออฟไลน์ — กด 'บันทึกเป็น Excel' เพื่อสำรองข้อมูล", 'err');
    return false;
  }

  // ===== โหลดข้อมูลจาก API (ถ้าเชื่อมต่อได้) =====
  async function loadFromSheet() {
    const ok = await checkAPI();
    if (!ok) {
      alert("ℹ️ ไม่สามารถโหลดข้อมูลออนไลน์ได้ในขณะนี้\n\n👉 ทำงานแบบออฟไลน์แทน\n👉 กด 'บันทึกเป็น Excel' เพื่อเก็บข้อมูล");
      renderCurrentView();
      return;
    }

    try {
      setStatus("🔄 กำลังโหลดข้อมูล...");
      const res = await fetch(APPSCRIPT_URL);
      const data = await res.json();
      
      tankDB = {};
      for (let i = 1; i < data.length; i++) {
        const row = data[i];
        if (!row[0]) continue;
        const serial = String(row[0]).trim();
        if (!tankDB[serial]) tankDB[serial] = [];
        for (let r = 1; r <= 3; r++) {
          const o = (r - 1) * 13 + 1;
          if (row[o]) {
            tankDB[serial].push({
              serial: serial,
              round: r,
              date: toDDMMYYYY(row[o + 1]),
              before: row[o + 2],
              after: row[o + 3],
              weight: row[o + 4],
              pressure: row[o + 5],
              ch4: row[o + 6],
              co2: row[o + 7],
              h2s: row[o + 8],
              meterStart: row[o + 9],
              meterEnd: row[o + 10],
              meterTotal: row[o + 11]
            });
          }
        }
      }
      const count = Object.keys(tankDB).length;
      setStatus(`✅ โหลดข้อมูลล่าสุด — ${count} ถัง`, 'ok');
      renderCurrentView();
    } catch (err) {
      console.error(err);
      setStatus("⚠️ โหลดไม่สำเร็จ — ทำงานแบบออฟไลน์", 'err');
    }
  }

  // ===== บันทึกข้อมูลไป API =====
  async function saveToSheet(rec) {
    if (!apiAvailable) {
      alert("ℹ️ บันทึกสำเร็จในหน้าเว็บ\n⚠️ ยังไม่ได้ส่งขึ้นออนไลน์\n👉 กด 'บันทึกเป็น Excel' เพื่อสำรองข้อมูล");
      return true;
    }

    try {
      setStatus("⏳ กำลังบันทึกข้อมูล...");
      await fetch(APPSCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(rec)
      });
      setStatus("✅ บันทึกสำเร็จ! กดโหลดเพื่อเห็นข้อมูลล่าสุด", 'ok');
      return true;
    } catch (err) {
      console.error(err);
      setStatus("⚠️ บันทึกสำเร็จในหน้าเว็บ แต่ส่งออนไลน์ไม่ได้", 'err');
      return true;
    }
  }

  function renderCurrentView() {
    const container = document.getElementById('tableContainer');
    const actionsDiv = document.getElementById('tankActions');

    if (currentView === 'single') {
      if (!currentSerial) {
        container.style.display = 'none';
        actionsDiv.classList.add('hidden');
        document.getElementById('tankSerial').textContent = "#—";
        document.getElementById('tankDesc').textContent = "ค้นหาเลขถังเพื่อดูข้อมูล";
        return;
      }
      actionsDiv.classList.remove('hidden');
      renderTankDetail(currentSerial);
      return;
    }

    actionsDiv.classList.add('hidden');
    document.getElementById('formCard').classList.add('hidden');
    document.getElementById('tankCard').style.display = 'none';
    container.style.display = 'block';

    renderAllStandardView();
  }

  function renderTankDetail(serial) {
    document.getElementById('tankCard').style.display = 'block';
    document.getElementById('tankSerial').textContent = "#" + serial;
    const records = tankDB[serial] || [];
    document.getElementById('tankDesc').textContent = `พบทั้งหมด ${records.length} ครั้ง`;

    const container = document.getElementById('tableContainer');
    container.style.display = 'block';

    const r1 = records.find(r => r.round === 1) || {};
    const r2 = records.find(r => r.round === 2) || {};
    const r3 = records.find(r => r.round === 3) || {};

    container.innerHTML = standardTableHeader() + buildStandardRow(serial, r1, r2, r3) + `</tbody></table>`;
  }

  function renderAllStandardView() {
    const container = document.getElementById('tableContainer');
    const allSerials = Object.keys(tankDB).sort();

    if (!allSerials.length) {
      container.innerHTML = `<div style="padding:24px;text-align:center;color:#666;">📭 ยังไม่มีข้อมูล — กด "บันทึกข้อมูลใหม่" เพื่อเริ่มใช้งาน</div>`;
      return;
    }

    let html = standardTableHeader();
    allSerials.forEach(serial => {
      const records = tankDB[serial] || [];
      const r1 = records.find(r => r.round === 1) || {};
      const r2 = records.find(r => r.round === 2) || {};
      const r3 = records.find(r => r.round === 3) || {};
      html += buildStandardRow(serial, r1, r2, r3);
    });
    html += `</tbody></table>`;
    container.innerHTML = html;
  }

  function showTankForm(serial, roundNum = null) {
    currentSerial = serial;
    currentView = 'single';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('[data-view="single"]').classList.add('active');

    document.getElementById('fSerial').value = serial;
    const records = tankDB[serial] || [];

    if (roundNum) {
      editMode = true;
      document.getElementById('fRound').value = roundNum;
      const rec = records.find(r => r.round === roundNum);
      if (rec) {
        document.getElementById('fDate').value = rec.date || '';
        document.getElementById('fBefore').value = rec.before || '';
        document.getElementById('fAfter').value = rec.after || '';
        document.getElementById('fWeight').value = rec.weight || '';
        document.getElementById('fPress').value = rec.pressure || '';
        document.getElementById('fCH4').value = rec.ch4 || '';
        document.getElementById('fCO2').value = rec.co2 || '';
        document.getElementById('fH2S').value = rec.h2s || '';
        document.getElementById('fMStart').value = rec.meterStart || '';
        document.getElementById('fMEnd').value = rec.meterEnd || '';
        document.getElementById('fMTotal').value = rec.meterTotal || '';
      }
      document.getElementById('formModeTitle').textContent = `✏️ แก้ไขประวัติครั้งที่ ${roundNum}`;
      document.getElementById('btnSave').textContent = `✅ บันทึกการแก้ไขครั้งที่ ${roundNum}`;
      document.getElementById('btnSave').classList.add('edit-mode');
    } else {
      editMode = false;
      document.getElementById('fRound').value = Math.min(records.length + 1, 3);
      document.getElementById('fDate').value = toDDMMYYYY(new Date());
      document.getElementById('fBefore').value = '';
      document.getElementById('fAfter').value = '';
      document.getElementById('fWeight').value = '';
      document.getElementById('fPress').value = '';
      document.getElementById('fCH4').value = '';
      document.getElementById('fCO2').value = '';
      document.getElementById('fH2S').value = '';
      document.getElementById('fMStart').value = '';
      document.getElementById('fMEnd').value = '';
      document.getElementById('fMTotal').value = '';
      document.getElementById('formModeTitle').textContent = '📋 ข้อมูลการอัด';
      document.getElementById('btnSave').textContent = '✅ บันทึกข้อมูล';
      document.getElementById('btnSave').classList.remove('edit-mode');
    }

    document.getElementById('formCard').classList.remove('hidden');
    document.getElementById('tankCard').style.display = 'block';
    document.getElementById('tankActions').classList.remove('hidden');
    renderTankDetail(serial);
    
    if (!roundNum && records.length >= 3) {
      document.getElementById('formCard').classList.add('hidden');
      alert("✅ บันทึกครบ 3 ครั้งแล้ว! กดปุ่มแก้ไขเพื่อแก้ข้อมูลเดิม");
    }
  }

  // ===== 🗑️ ลบประวัติครั้งที่ 1 =====
  document.getElementById('btnDelRound1').addEventListener('click', function() {
    if (!currentSerial) return alert("⚠️ กรุณาค้นหาเลขถังก่อน");
    const pass = prompt("🔑 กรุณาใส่รหัสผ่านเพื่อลบประวัติครั้งที่ 1:");
    if (pass !== PASSWORD_DEL_ROUND1) return alert("❌ รหัสผ่านไม่ถูกต้อง!");
    if (!confirm(`⚠️ ต้องการลบประวัติครั้งที่ 1 ของถัง #${currentSerial} หรือไม่?\n\n(ครั้งที่ 2→1, ครั้งที่ 3→2)`)) return;

    tankDB[currentSerial] = (tankDB[currentSerial] || []).filter(r => r.round !== 1);
    tankDB[currentSerial].sort((a,b) => a.round - b.round);
    tankDB[currentSerial].forEach((r, i) => { r.round = i + 1; });

    alert("✅ ลบสำเร็จ!");
    renderTankDetail(currentSerial);
  });

  // ===== ✏️ แก้ไขแต่ละครั้ง =====
  document.getElementById('btnEdit1').addEventListener('click', () => {
    if (!currentSerial) return alert("⚠️ กรุณาค้นหาเลขถังก่อน");
    showTankForm(currentSerial, 1);
  });
  document.getElementById('btnEdit2').addEventListener('click', () => {
    if (!currentSerial) return alert("⚠️ กรุณาค้นหาเลขถังก่อน");
    showTankForm(currentSerial, 2);
  });
  document.getElementById('btnEdit3').addEventListener('click', () => {
    if (!currentSerial) return alert("⚠️ กรุณาค้นหาเลขถังก่อน");
    showTankForm(currentSerial, 3);
  });

  // ===== 🗑️ ลบประวัติทั้งหมด =====
  document.getElementById('btnClearAll').addEventListener('click', function() {
    const pass = prompt("🔑 กรุณาใส่รหัสผ่านเพื่อลบประวัติทั้งหมด:");
    if (pass !== PASSWORD_CLEAR_ALL) return alert("❌ รหัสผ่านไม่ถูกต้อง!");
    if (!confirm("⚠️⚠️⚠️ ต้องการลบประวัติทั้งหมดหรือไม่?")) return;
    tankDB = {};
    currentSerial = null;
    alert("✅ ลบประวัติทั้งหมดสำเร็จ!");
    location.reload();
  });

  // ===== บันทึกข้อมูล =====
  document.getElementById('btnSave').addEventListener('click', async function() {
    const dateVal = parseDateInput(document.getElementById('fDate').value);
    if (!dateVal) return alert("⚠️ รูปแบบวันที่ไม่ถูกต้อง — กรอกเป็น วัน/เดือน/ปี เช่น 09/09/2026");

    const rec = {
      serial: document.getElementById('fSerial').value,
      round: parseInt(document.getElementById('fRound').value),
      date: dateVal,
      before: document.getElementById('fBefore').value,
      after: document.getElementById('fAfter').value,
      weight: document.getElementById('fWeight').value,
      pressure: document.getElementById('fPress').value,
      ch4: document.getElementById('fCH4').value,
      co2: document.getElementById('fCO2').value,
      h2s: document.getElementById('fH2S').value,
      meterStart: document.getElementById('fMStart').value,
      meterEnd: document.getElementById('fMEnd').value,
      meterTotal: document.getElementById('fMTotal').value
    };

    if (!rec.serial || !rec.date) return alert("⚠️ กรุณากรอกเลขถังและวันที่");

    if (!tankDB[rec.serial]) tankDB[rec.serial] = [];
    tankDB[rec.serial] = tankDB[rec.serial].filter(r => !(r.round === rec.round));
    tankDB[rec.serial].push(rec);

    const ok = await saveToSheet(rec);
    if (ok) {
      alert(editMode 
        ? `✅ แก้ไขข้อมูลครั้งที่ ${rec.round} สำเร็จ!` 
        : `✅ บันทึกครั้งที่ ${rec.round} สำเร็จ!`);
      document.getElementById('formCard').classList.add('hidden');
      renderTankDetail(rec.serial);
    }
  });

  // ===== ปุ่มโหลดข้อมูลล่าสุด =====
  document.getElementById('btnRefresh').addEventListener('click', loadFromSheet);

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      currentView = this.dataset.view;
      renderCurrentView();
    });
  });

  document.getElementById('btnSearch').addEventListener('click', () => {
    const s = document.getElementById('serialInput').value.trim();
    if (!s) return alert("⚠️ กรุณากรอกเลขถัง");
    showTankForm(s);
  });

  document.getElementById('toggleForm').addEventListener('click', () => {
    let s = document.getElementById('serialInput').value.trim() || prompt("กรุณากรอกเลขถังแก๊ส:");
    if (s) { document.getElementById('serialInput').value = s; showTankForm(s); }
  });

  // ===== ส่งออก Excel =====
  document.getElementById('btnExport').addEventListener('click', function() {
    const wb = XLSX.utils.book_new();
    const rows = [["เลขถังแก๊ส",
      "ครั้งที่ 1","วันที่","น้ำหนักก่อนอัด (กก.)","น้ำหนักหลังอัด (กก.)","น้ำหนักรวมครั้งที่ 1","แรงดันแก๊ส","CH4","CO2","H2S","Gas Meter Start","Gas Meter Finish","รวม Gas Meter/M3",
      "ครั้งที่ 2","วันที่","น้ำหนักก่อนอัด (กก.)","น้ำหนักหลังอัด (กก.)","น้ำหนักรวมครั้งที่ 2","แรงดันแก๊ส","CH4","CO2","H2S","Gas Meter Start","Gas Meter Finish","รวม Gas Meter/M3",
      "ครั้งที่ 3","วันที่","น้ำหนักก่อนอัด (กก.)","น้ำหนักหลังอัด (กก.)","น้ำหนักรวมครั้งที่ 3","แรงดันแก๊ส","CH4","CO2","H2S","Gas Meter Start","Gas Meter Finish","รวม Gas Meter/M3",
      "รวมน้ำหนัก"]];
    
    Object.entries(tankDB).forEach(([serial, records]) => {
      const r1 = records.find(r => r.round === 1) || {};
      const r2 = records.find(r => r.round === 2) || {};
      const r3 = records.find(r => r.round === 3) || {};
      const totalKG = ((parseFloat(r1.weight)||0)+(parseFloat(r2.weight)||0)+(parseFloat(r3.weight)||0)).toFixed(2);
      rows.push([
        serial,
        r1.round||1, r1.date||'', r1.before||'', r1.after||'', r1.weight||'', r1.pressure||'', r1.ch4||'', r1.co2||'', r1.h2s||'', r1.meterStart||'', r1.meterEnd||'', r1.meterTotal||'',
        r2.round||2, r2.date||'', r2.before||'', r2.after||'', r2.weight||'', r2.pressure||'', r2.ch4||'', r2.co2||'', r2.h2s||'', r2.meterStart||'', r2.meterEnd||'', r2.meterTotal||'',
        r3.round||3, r3.date||'', r3.before||'', r3.after||'', r3.weight||'', r3.pressure||'', r3.ch4||'', r3.co2||'', r3.h2s||'', r3.meterStart||'', r3.meterEnd||'', r3.meterTotal||'',
        totalKG
      ]);
    });

    const ws = XLSX.utils.aoa_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, "ทะเบียนถังแก๊ส");
    XLSX.writeFile(wb, "ทะเบียนถังแก๊ส_" + toDDMMYYYY(new Date()).replace(/\//g,'-') + ".xlsx");
  });

  // ===== สแกน QR Code =====
  document.getElementById('btnScan').addEventListener('click', async function() {
    const wrap = document.getElementById('scanWrap');
    const video = document.getElementById('video');
    wrap.classList.toggle('hidden');
    if (!wrap.classList.contains('hidden')) {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = videoStream;
        video.onplay = () => { scanQR(); };
      } catch {
        alert("⚠️ เปิดกล้องไม่ได้ — พิมพ์เลขถังเองแทน");
        wrap.classList.add('hidden');
      }
    } else {
      if (videoStream) videoStream.getTracks().forEach(t => t.stop());
    }
  });

  function scanQR() {
    const video = document.getElementById('video');
    if (video.readyState < 2) return requestAnimationFrame(scanQR);
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(img.data, img.width, img.height);
    if (code && code.data) {
      if (videoStream) videoStream.getTracks().forEach(t => t.stop());
      document.getElementById('scanWrap').classList.add('hidden');
      document.getElementById('serialInput').value = code.data.trim();
      showTankForm(code.data.trim());
      return;
    }
    requestAnimationFrame(scanQR);
  }

  // ตรวจสอบการเชื่อมต่อเมื่อเปิดหน้า
  checkAPI().then(() => {
    renderCurrentView();
  });
});
</script>
</body>
</html>
