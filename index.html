<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ทะเบียนถังแก๊ส — Cenergy Solutions</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: "Segoe UI", sans-serif; margin: 0; padding: 0; }
    body { background: #f0f4f8; padding: 16px; max-width: 1200px; margin: 0 auto; color: #333; }

    /* ===== แถบสถานะ ซิงค์ข้อมูล ===== */
    .sync-bar { 
      background: #e8f7ff; 
      padding: 14px 18px; 
      border-radius: 10px; 
      margin-bottom: 14px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      flex-wrap: wrap; 
      gap: 12px; 
      border: 1px solid #b3e5fc; 
    }
    .sync-status { 
      font-size: 14px; 
      color: #0277bd; 
      display: flex; 
      align-items: center; 
      gap: 8px; 
    }
    .sync-status.err { color: #d32f2f; }
    .sync-status.ok { color: #2e7d32; }
    .sync-btn { 
      padding: 10px 22px; 
      background: #1976d2; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 14px; 
      font-weight: 500; 
    }
    .sync-btn:hover { background: #1565c0; }
    .btn-export { 
      background: #2e7d32; 
      color: white; 
      border: none; 
    }
    .btn-export:hover { background: #27692a; }

    /* ===== แถบแจ้งเตือน ===== */
    .alert-box { 
      background: #fff3e0; 
      border: 1px solid #ffe0b2; 
      border-radius: 10px; 
      padding: 12px 16px; 
      margin-bottom: 18px; 
      font-size: 14px; 
      line-height: 1.6; 
      color: #e65100; 
    }

    /* ===== ปุ่มด้านบน ===== */
    .top-buttons { 
      display: flex; 
      gap: 12px; 
      margin-bottom: 18px; 
      flex-wrap: wrap; 
    }
    .btn-main { 
      padding: 12px 20px; 
      border: none; 
      border-radius: 8px; 
      font-size: 15px; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      font-weight: 500; 
    }
    .btn-scan { 
      background: #1976d2; 
      color: white; 
    }
    .btn-scan:hover { background: #1565c0; }
    .btn-danger-all { 
      background: #c62828; 
      color: white; 
      border: none; 
    }
    .btn-danger-all:hover { background: #b71c1c; }

    /* ===== ช่องค้นหา ===== */
    .search-row { 
      display: flex; 
      gap: 10px; 
      margin-bottom: 20px; 
      flex-wrap: wrap; 
    }
    .search-input { 
      flex: 1; 
      min-width: 200px; 
      padding: 12px 16px; 
      border: 1px solid #ccc; 
      border-radius: 8px; 
      font-size: 15px; 
      background: #fff; 
    }
    .search-btn { 
      padding: 12px 24px; 
      background: #1976d2; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-size: 15px; 
      cursor: pointer; 
      font-weight: 500; 
    }
    .search-btn:hover { background: #1565c0; }

    /* ===== แถบปุ่มสลับรายงาน ===== */
    .view-tabs { 
      display: flex; 
      gap: 10px; 
      margin-bottom: 20px; 
      flex-wrap: wrap; 
    }
    .tab-btn { 
      padding: 12px 18px; 
      border: none; 
      border-radius: 8px; 
      font-size: 14px; 
      cursor: pointer; 
      background: #ffffff; 
      color: #555; 
      border: 1px solid #ddd; 
      display: flex; 
      align-items: center; 
      gap: 6px; 
      transition: all 0.2s; 
    }
    .tab-btn.active { 
      background: #e3f2fd; 
      color: #1976d2; 
      border-color: #90caf9; 
      font-weight: 500; 
    }
    .tab-btn:hover:not(.active) { background: #f5f5f5; border-color: #bbb; }
    .tab-count { 
      background: #1976d2; 
      color: white; 
      font-size: 13px; 
      padding: 2px 10px; 
      border-radius: 12px; 
      margin-left: 6px; 
      min-width: 28px; 
      text-align: center; 
    }
    .tab-btn.active .tab-count { background: #1565c0; }

    /* ===== สรุปจำนวนถัง ===== */
    .summary-bar { 
      background: #e8f5e9; 
      padding: 14px 18px; 
      border-radius: 10px; 
      margin-bottom: 14px; 
      border: 1px solid #c8e6c9; 
      font-size: 15px; 
    }

    /* ===== ตารางแสดงรายการ ===== */
    .table-container { 
      overflow-x: auto; 
      border-radius: 10px; 
      border: 1px solid #ccc; 
      background: white; 
      margin-top: 10px; 
    }
    table { 
      width: 100%; 
      border-collapse: collapse; 
      font-size: 12px; 
      white-space: nowrap; 
    }
    th { 
      background: #1976d2; 
      color: white; 
      padding: 8px 4px; 
      text-align: center; 
      border: 1px solid #1565c0; 
      font-weight: 500; 
      font-size: 11px; 
    }
    td { 
      padding: 7px 4px; 
      text-align: center; 
      border: 1px solid #e0e0e0; 
    }
    tr:hover td { background: #f5f9fc; }
    .serial-cell { 
      font-weight: bold; 
      color: #1565c0; 
      background: #e3f2fd; 
    }
    .weight-cell { 
      font-weight: bold; 
      color: #e65100; 
    }
    .total-kg { 
      font-weight: bold; 
      background: #e8f5e9; 
      color: #2e7d32; 
      font-size: 14px; 
    }

    /* ===== กล้องสแกน QR ===== */
    .scan-box { 
      position: relative; 
      width: 100%; 
      max-width: 480px; 
      margin: 15px auto; 
      border-radius: 12px; 
      overflow: hidden; 
      border: 3px solid #1976d2; 
      background: #000; 
    }
    video { width: 100%; height: auto; display: block; }
    .scan-frame { 
      position: absolute; 
      inset: 0; 
      border: 4px solid #ffc107; 
      box-shadow: inset 0 0 0 9999px rgba(0,0,0,0.4); 
      pointer-events: none; 
    }
    .scan-hint { 
      text-align: center; 
      padding: 10px; 
      color: #1976d2; 
      font-size: 14px; 
    }

    /* ===== ซ่อน/แสดง ===== */
    .hidden { display: none !important; }

    /* ===== ฟอร์มบันทึกข้อมูล ===== */
    .tank-card { 
      background: #1976d2; 
      color: white; 
      padding: 20px; 
      border-radius: 10px; 
      margin-bottom: 14px; 
    }
    .tank-serial { font-size: 26px; font-weight: bold; margin-bottom: 6px; }
    .tank-desc { font-size: 15px; opacity: 0.9; }
    .action-buttons { display: flex; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
    .btn-edit { 
      background: #42a5f5; 
      color: white; 
      border: none; 
    }
    .btn-edit:hover { background: #1e88e5; }
    .btn-danger { 
      background: #ef5350; 
      color: white; 
      border: none; 
    }
    .btn-danger:hover { background: #e53935; }
    .edit-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .add-btn { 
      width: 100%; 
      background: #e3f2fd; 
      color: #1976d2; 
      border: none; 
      padding: 14px; 
      font-size: 16px; 
      border-radius: 10px; 
      cursor: pointer; 
      margin-bottom: 18px; 
      font-weight: 500; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
    }
    .add-btn:hover { background: #bbdefb; }
    .form-card { 
      background: #fafafa; 
      padding: 22px; 
      border-radius: 10px; 
      margin-bottom: 18px; 
      border: 1px solid #e0e0e0; 
    }
    .form-title { 
      font-size: 16px; 
      font-weight: 600; 
      margin: 14px 0 10px 0; 
      color: #1976d2; 
      border-bottom: 2px solid #1976d2; 
      padding-bottom: 6px; 
    }
    .form-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
      gap: 12px; 
      margin-bottom: 14px; 
    }
    .form-group { display: flex; flex-direction: column; }
    label { font-size: 13px; color: #555; margin-bottom: 5px; }
    input { 
      padding: 10px 12px; 
      border: 1px solid #ccc; 
      border-radius: 6px; 
      font-size: 15px; 
      background: #fff; 
    }
    input:focus { outline: none; border-color: #1976d2; box-shadow: 0 0 0 3px rgba(25,118,210,0.1); }
    input[readonly] { background: #f5f5f5; color: #1565c0; font-weight: 500; }
    .calc-note { font-size: 12px; color: #1976d2; margin-top: 4px; }
    .save-btn { 
      width: 100%; 
      background: #1976d2; 
      color: white; 
      border: none; 
      padding: 15px; 
      font-size: 17px; 
      border-radius: 10px; 
      cursor: pointer; 
      margin-top: 10px; 
      font-weight: 500; 
    }
    .save-btn:hover { background: #1565c0; }
    .save-btn.edit-mode { background: #2e7d32; }
    .save-btn.edit-mode:hover { background: #27692a; }

    /* ===== ตัวกรองวันที่ ===== */
    .filter-bar { 
      background: #fff; 
      padding: 14px 18px; 
      border-radius: 10px; 
      margin-bottom: 18px; 
      border: 1px solid #e0e0e0; 
      display: flex; 
      gap: 12px; 
      align-items: center; 
      flex-wrap: wrap; 
    }
    .filter-bar label { font-size: 14px; font-weight: 500; color: #333; }
    .filter-bar input { padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
  </style>
</head>
<body>

<!-- ✅ แถบสถานะ + ปุ่มโหลด/ส่งออก -->
<div class="sync-bar">
  <span class="sync-status" id="syncStatus">✅ ทำงานแบบออฟไลน์ — กดโหลดเมื่อต้องการซิงค์</span>
  <div style="display:flex; gap:10px;">
    <button class="sync-btn" id="btnRefresh">🔄 โหลดข้อมูลล่าสุด</button>
    <button class="sync-btn btn-export" id="btnExportCurrent">📥 ส่งออก Excel หน้านี้</button>
  </div>
</div>

<!-- ✅ แถบแจ้งเตือน -->
<div class="alert-box" id="alertBox">
  ℹ️ ข้อมูลจะทำงานได้ทันที — กด "ส่งออก Excel" เพื่อสำรองข้อมูล
</div>

<!-- ✅ ปุ่ม สแกน QR + ลบประวัติทั้งหมด -->
<div class="top-buttons">
  <button class="btn-main btn-scan" id="btnScan">📷 สแกน QR Code</button>

</div>

<!-- ✅ กล้องสแกน QR -->
<div class="scan-box hidden" id="scanWrap">
  <video id="video" autoplay playsinline muted></video>
  <div class="scan-frame"></div>
  <div class="scan-hint">ส่อง QR Code บนถังแก๊ส</div>
</div>

<!-- ✅ ช่องค้นหา -->
<div class="search-row">
  <input type="text" class="search-input" id="serialInput" placeholder="พิมพ์เลขถัง เช่น 001" />
  <button class="search-btn" id="btnSearch">ค้นหา</button>
</div>

<!-- ✅ ปุ่มสลับรายงาน — แสดงจำนวนถังทุกปุ่ม -->
<div class="view-tabs">
  <button class="tab-btn" data-view="alltanks">📋 รายงานหมายเลขถังทั้งหมด <span class="tab-count" id="tabAllCount">0</span></button>

</div>

<!-- ✅ ตัวกรองวันที่ รายงานประจำวัน -->
<div class="filter-bar hidden" id="dailyFilter">

  <input type="date" id="selDate" />

</div>

<!-- ✅ ตัวกรองเดือน รายงานประจำเดือน -->
<div class="filter-bar hidden" id="monthlyFilter">

  <input type="month" id="selMonth" />

</div>

<!-- ✅ สรุปจำนวนถัง -->
<div class="summary-bar hidden" id="summaryBar">

<!-- ข้อมูลถังที่เลือก -->
<div class="tank-card hidden" id="tankCard">

</div>

<div class="action-buttons hidden" id="tankActions">

    <button class="btn-main btn-edit" id="btnEdit2">✏️ แก้ไขครั้งที่ 2</button>
    <button class="btn-main btn-edit" id="btnEdit3">✏️ แก้ไขครั้งที่ 3</button>

<button class="add-btn hidden" id="toggleForm">+ บันทึกข้อมูลการอัดใหม่ (ครั้งที่ 1 / 2 / 3)</button>

<div class="form-card hidden" id="formCard">
  <div class="form-grid" style="grid-template-columns: 1fr 1fr;">
    <div class="form-group">
      <label>เลขถังแก๊ส</label>
      <input type="text" id="fSerial" readonly />

  <div class="form-title" id="formModeTitle">📋 ข้อมูลการอัดแก๊ส</div>

    <div class="form-group">
      <label>วันที่</label>
      <input type="text" id="fDate" placeholder="วัน/เดือน/ปี เช่น 09/09/2026" />

      <label>น้ำหนักก่อนอัด (KG.)</label>
      <input type="number" step="0.01" id="fBefore" placeholder="0.00" oninput="calcWeight()" />
    </div>
    <div class="form-group">
      <label>น้ำหนักหลังอัด (KG.)</label>
      <input type="number" step="0.01" id="fAfter" placeholder="0.00" oninput="calcWeight()" />
    </div>
    <div class="form-group">
      <label>น้ำหนักรวม (KG.)</label>
      <input type="text" id="fWeight" readonly placeholder="อัตโนมัติ" />

    <div class="form-group">
      <label>แรงดัน (Bar)</label>

    </div>
    <div class="form-group">
      <label>CH4 (%)</label>
      <input type="number" step="0.01" id="fCH4" placeholder="—" />
    </div>
    <div class="form-group">
      <label>CO2 (%)</label>
      <input type="number" step="0.01" id="fCO2" placeholder="—" />
    </div>
    <div class="form-group">
      <label>H2S (ppm)</label>
      <input type="number" step="0.01" id="fH2S" placeholder="—" />
    </div>
    <div class="form-group">
      <label>Gas Meter Start</label>
      <input type="number" step="0.01" id="fMStart" placeholder="0.00" oninput="calcMeter()" />
    </div>
    <div class="form-group">
      <label>Gas Meter Finish</label>
      <input type="number" step="0.01" id="fMEnd" placeholder="0.00" oninput="calcMeter()" />
    </div>
    <div class="form-group">
      <label>รวม Gas Meter/M3</label>
      <input type="text" id="fMTotal" readonly placeholder="อัตโนมัติ" />
      <div class="calc-note">= Finish − Start</div>
    </div>

  <button class="save-btn" id="btnSave">✅ บันทึกข้อมูล</button>
</div>

<div class="table-container" id="tableContainer" style="display:none;"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
// 🔑 รหัสผ่าน
const PASSWORD_DEL_ROUND1 = "del123";
const PASSWORD_CLEAR_ALL = "clear999";

let editMode = false;
let tankDB = {};
let currentSerial = null;
let currentView = 'all';
let selectedDailyDate = null;
let selectedMonth = null;
let videoStream = null;
let scanning = false;
const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');

const APPSCRIPT_URL = "https://script.google.com/macros/s/AKfycbyhApPZRt1_HMtEUqkPa0its2izh2kIlljgqTTzZUj-gTmyF6DzWEzeGREAB5x_DPEn/exec";
let apiAvailable = false;

// ===== ✅ อัปเดตจำนวนถังทุกปุ่ม =====
function updateAllCounts() {
  const totalTanks = Object.keys(tankDB).length;
  document.getElementById('tabAllCount').textContent = totalTanks;
  document.getElementById('tabTotalCount').textContent = totalTanks;

  // อัปเดตจำนวนถังในปุ่มรายงานประจำวัน
  if (selectedDailyDate) {
    const targetDate = ymdToDmy(selectedDailyDate);
    const dailyCount = Object.values(tankDB).filter(rs => rs.some(r => r.date === targetDate)).length;
    document.getElementById('tabDailyCount').textContent = dailyCount;
  } else {
    document.getElementById('tabDailyCount').textContent = '0';
  }

  // อัปเดตจำนวนถังในปุ่มรายงานประจำเดือน
  if (selectedMonth) {
    const [yr, mo] = selectedMonth.split('-');
    const monthLabel = `${mo}/${yr}`;
    const monthlyCount = Object.values(tankDB).filter(rs => rs.some(r => r.date.endsWith(monthLabel))).length;
    document.getElementById('tabMonthlyCount').textContent = monthlyCount;
  } else {
    document.getElementById('tabMonthlyCount').textContent = '0';
  }
}

// ===== แปลงวันที่เป็น DD/MM/YYYY =====
function toDDMMYYYY(date) {
  if (!date) return "";
  let d = typeof date === 'string' && date.includes('T') ? new Date(date) : new Date(date);
  if (isNaN(d.getTime())) return "";
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

function ymdToDmy(ymd) {
  if (!ymd) return "";
  const [y,m,d] = ymd.split('-');
  return `${d}/${m}/${y}`;
}

function getMonthLabel(dateStr) {
  if (!dateStr) return "";
  const parts = dateStr.split('/');
  return parts.length === 3 ? `${parts[1]}/${parts[2]}` : "";
}

function parseDateInput(val) {
  if (!val) return null;
  const m = String(val).trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m) {
    const dt = new Date(parseInt(m[3]), parseInt(m[2])-1, parseInt(m[1]));
    if (!isNaN(dt.getTime())) return toDDMMYYYY(dt);
  }
  return null;
}

document.addEventListener('DOMContentLoaded', function() {
  window.calcWeight = () => {
    const b = parseFloat(document.getElementById('fBefore').value)||0;
    const a = parseFloat(document.getElementById('fAfter').value)||0;
    document.getElementById('fWeight').value = (a-b).toFixed(2);
  };
  window.calcMeter = () => {
    const s = parseFloat(document.getElementById('fMStart').value)||0;
    const e = parseFloat(document.getElementById('fMEnd').value)||0;
    document.getElementById('fMTotal').value = (e-s).toFixed(2);
  };

  function setStatus(text, type='info') {
    const el = document.getElementById('syncStatus');
    el.textContent = text;
    el.className = "sync-status";
    if (type==='ok') el.classList.add('ok');
    if (type==='err') el.classList.add('err');
  }

  async function checkAPI() {
    try {
      const res = await fetch(APPSCRIPT_URL, {signal: AbortSignal.timeout(3000)});
      if (res.ok) { apiAvailable=true; setStatus("✅ เชื่อมต่อระบบออนไลน์", 'ok'); return true; }
    } catch(e) {}
    apiAvailable = false;
    setStatus("⚠️ ทำงานแบบออฟไลน์", 'err');
    return false;
  }

  async function loadFromSheet() {
    if (!await checkAPI()) { alert("ℹ️ ทำงานแบบออฟไลน์"); renderCurrentView(); return; }
    try {
      setStatus("🔄 กำลังโหลด...");
      const data = await (await fetch(APPSCRIPT_URL)).json();
      tankDB = {};
      for (let i=1; i<data.length; i++) {
        const row = data[i], serial = String(row[0]||'').trim();
        if (!serial) continue;
        if (!tankDB[serial]) tankDB[serial]=[];
        for (let r=1; r<=3; r++) {
          const o=(r-1)*13+1;
          if (row[o]) tankDB[serial].push({
            serial, round:r, date:toDDMMYYYY(row[o+1]),
            before:row[o+2], after:row[o+3], weight:row[o+4],
            pressure:row[o+5], ch4:row[o+6], co2:row[o+7], h2s:row[o+8],
            meterStart:row[o+9], meterEnd:row[o+10], meterTotal:row[o+11]
          });
        }
      }
      updateAllCounts();
      setStatus(`✅ โหลดสำเร็จ — ${Object.keys(tankDB).length} ถัง`, 'ok');
      renderCurrentView();
    } catch(e) { setStatus("⚠️ โหลดไม่สำเร็จ", 'err'); }
  }

  async function saveToSheet(rec) {
    if (!apiAvailable) { alert("✅ บันทึกสำเร็จในหน้าเว็บ"); return true; }
    try {
      setStatus("⏳ กำลังบันทึก...");
      await fetch(APPSCRIPT_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec)});
      setStatus("✅ บันทึกสำเร็จ!", 'ok');
      return true;
    } catch { setStatus("✅ บันทึกสำเร็จในหน้าเว็บ", 'err'); return true; }
  }

        periodLabel = `เดือน ${monthLabel}`;

        const r1 = rs.find(r=>filterFn(r) && r.round===1) || {};

  // ===== แสดงรายงานตามประเภท =====
  function renderCurrentView() {
    const container = document.getElementById('tableContainer');
    setupViewUI(currentView);
    updateAllCounts(); // ✅ อัปเดตจำนวนทุกครั้งที่เปลี่ยนมุมมอง

    // ===== รายงานหมายเลขถังทั้งหมด =====
    if (currentView==='alltanks') {
      const list = Object.keys(tankDB).sort((a,b)=>a.localeCompare(b[0]));
      if (!list.length) { container.innerHTML = `<div style="padding:40px;text-align:center;color:#666;">📭 ยังไม่มีข้อมูลถังแก๊ส</div>`; return; }
      let html = `<table><thead><tr><th>ลำดับ</th><th>หมายเลขถังแก๊ส</th><th>จำนวนครั้งที่บันทึก</th></tr></thead><tbody>`;
      list.forEach((s,i)=>html += `<tr onclick="showTankForm('${s}')"><td>${i+1}</td><td style="font-weight:bold;color:#1565c0;">${s}</td><td><span style="background:#e3f2fd;color:#1565c0;padding:4px 12px;border-radius:12px;font-weight:600;">${tankDB[s].length} ครั้ง</span></td></tr>`);
      html += `</tbody></table>`;
      container.innerHTML = html;
      return;
    }

    // ===== ✅ รายงานประจำวัน =====
    if (currentView==='daily') {
      if (!selectedDailyDate) { container.innerHTML = `<div style="padding:40px;text-align:center;color:#666;">📅 เลือกวันที่แล้วกด "แสดงข้อมูล"</div>`; return; }
      const targetDate = ymdToDmy(selectedDailyDate);
      renderHorizontalReport(r => r.date === targetDate, `วันที่ ${targetDate}`);
      return;
    }

    // ===== ✅ รายงานประจำเดือน =====
    if (currentView==='monthly') {
      if (!selectedMonth) { container.innerHTML = `<div style="padding:40px;text-align:center;color:#666;">📅 เลือกเดือน/ปีแล้วกด "แสดงข้อมูล"</div>`; return; }
      const [yr, mo] = selectedMonth.split('-');
      const monthLabel = `${mo}/${yr}`;
      renderHorizontalReport(r => r.date.endsWith(monthLabel), `เดือน ${monthLabel}`);
      return;
    }

    // ===== ✅ ข้อมูลถังทั้งหมด — แสดงจำนวนถัง + รูปแบบแนวนอน =====
    if (currentView==='all') {
      renderHorizontalReport(() => true, "ทั้งหมด");
      return;
    }
  }

  // ===== แสดงฟอร์มบันทึก/แก้ไข =====
  window.showTankForm = function(serial, roundNum=null) {

    document.querySelector('[data-view="alltanks"]').classList.add('active');

    document.getElementById('tankActions').classList.remove('hidden');
    document.getElementById('fSerial').value = serial;

    if (roundNum) {
      editMode = true;
      document.getElementById('fRound').value = roundNum;
      const r = recs.find(x=>x.round===roundNum);
      if (r) {
        document.getElementById('fDate').value = r.date||'';
        document.getElementById('fBefore').value = r.before||'';
        document.getElementById('fAfter').value = r.after||'';
        document.getElementById('fWeight').value = r.weight||'';
        document.getElementById('fPress').value = r.pressure||'';
        document.getElementById('fCH4').value = r.ch4||'';
        document.getElementById('fCO2').value = r.co2||'';
        document.getElementById('fH2S').value = r.h2s||'';
        document.getElementById('fMStart').value = r.meterStart||'';
        document.getElementById('fMEnd').value = r.meterEnd||'';
        document.getElementById('fMTotal').value = r.meterTotal||'';
      }
      document.getElementById('formModeTitle').textContent = `✏️ แก้ไขประวัติครั้งที่ ${roundNum}`;
      document.getElementById('btnSave').textContent = `✅ บันทึกการแก้ไขครั้งที่ ${roundNum}`;
      document.getElementById('btnSave').classList.add('edit-mode');
    } else {
      editMode = false;
      document.getElementById('fRound').value = Math.min(recs.length+1,3);
      document.getElementById('fDate').value = toDDMMYYYY(new Date());
      document.getElementById('fBefore').value = '';
      document.getElementById('fAfter').value = '';
      document.getElementById('fWeight').value = '';
      document.getElementById('fPress').value = '';
      document.getElementById('fCH4').value = '';
      document.getElementById('fCO2').value = '';
      document.getElementById('fH2S').value = '';
      document.getElementById('fMStart').value = '';
      document.getElementById('fMEnd').value = '';
      document.getElementById('fMTotal').value = '';
      document.getElementById('formModeTitle').textContent = '📋 ข้อมูลการอัดแก๊ส';
      document.getElementById('btnSave').textContent = '✅ บันทึกข้อมูล';
      document.getElementById('btnSave').classList.remove('edit-mode');

    document.getElementById('formCard').classList.remove('hidden');
    renderCurrentView();

  };

    const round = parseInt(document.getElementById('fRound').value)||1;
    const date = parseDateInput(document.getElementById('fDate').value);
    const
